<title>PPA Pilot Maquette</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Mise en page : barre latérale fixe (objets du CRM) + zone de travail ; chaque écran = titre, action principale à droite, filtres, contenu */
:root{
 --bg:#F5F6F8;--panel:#FFFFFF;--ink:#16213A;--ink2:#4A5468;--mut:#7B8396;--line:#E3E6EC;--line2:#EEF0F4;
 --accent:#2456C7;--accent-ink:#FFFFFF;--accent-soft:#E8EEFB;--side:#14213D;--side-ink:#C9D2E6;--side-on:#FFFFFF;
 --good:#0B7A0B;--good-bg:#E6F4E6;--warn:#8A5A00;--warn-bg:#FFF3D6;--bad:#B42828;--bad-bg:#FCE9E9;--info:#2456C7;--info-bg:#E8EEFB;
 --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--chart-surface:#FFFFFF;--grid:#EEF0F4;--axis:#c3c2b7;--axis-ink:#7B8396;
 --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--f-head:"Space Grotesk","Inter",system-ui,sans-serif;
 --r:10px;--shadow:0 1px 2px rgba(22,33,58,.06),0 2px 8px rgba(22,33,58,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0F141E;--panel:#171D2A;--ink:#E8ECF4;--ink2:#B5BDCD;--mut:#8C94A6;--line:#2A3243;--line2:#222A39;
 --accent:#6E9BFF;--accent-ink:#0F141E;--accent-soft:#1D2A47;--side:#0B101A;--side-ink:#9AA6BF;--side-on:#FFFFFF;
 --good:#5FD25F;--good-bg:#15301A;--warn:#F5C14B;--warn-bg:#33290F;--bad:#FF8A8A;--bad-bg:#3A1A1C;--info:#8DB0FF;--info-bg:#1D2A47;
 --s1:#3987e5;--s2:#d95926;--s3:#199e70;--chart-surface:#171D2A;--grid:#232B3A;--axis:#383835;--axis-ink:#8C94A6;
 --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0F141E;--panel:#171D2A;--ink:#E8ECF4;--ink2:#B5BDCD;--mut:#8C94A6;--line:#2A3243;--line2:#222A39;
 --accent:#6E9BFF;--accent-ink:#0F141E;--accent-soft:#1D2A47;--side:#0B101A;--side-ink:#9AA6BF;--side-on:#FFFFFF;
 --good:#5FD25F;--good-bg:#15301A;--warn:#F5C14B;--warn-bg:#33290F;--bad:#FF8A8A;--bad-bg:#3A1A1C;--info:#8DB0FF;--info-bg:#1D2A47;
 --s1:#3987e5;--s2:#d95926;--s3:#199e70;--chart-surface:#171D2A;--grid:#232B3A;--axis:#383835;--axis-ink:#8C94A6;
 --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
/* barre latérale */
.side{background:var(--side);color:var(--side-ink);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto;padding-left:max(12px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;color:var(--side-on)}
.brand i{width:32px;height:32px;border-radius:8px;background:#2456C7;display:grid;place-items:center;font:700 12px var(--f-head);font-style:normal;letter-spacing:.06em;color:#fff}
.brand b{font:600 16px var(--f-head)}
.brand small{display:block;font-size:11px;color:var(--side-ink);font-weight:500}
.navgrp{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#6F7C99;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-weight:500;border:0;background:none;width:100%;text-align:left;cursor:pointer}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav:hover{background:rgba(255,255,255,.06);color:#fff}
.nav[aria-current="page"]{background:rgba(110,155,255,.18);color:#fff}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:600;background:rgba(255,255,255,.12);border-radius:999px;padding:1px 7px}
.nav .cnt.hot{background:#B42828;color:#fff}
.side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid rgba(255,255,255,.08)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;background:var(--accent-soft);color:var(--accent)}
.side .me .av{background:#2B3A5E;color:#fff}
.side .me small{display:block;font-size:11px}
/* zone principale */
main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.search{flex:1;min-width:0;max-width:520px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--mut)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;width:100%}
.search kbd{font:11px var(--f-ui);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.demo{font-size:11.5px;font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:999px;padding:3px 10px;white-space:nowrap}
.view{padding-block:22px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;min-width:0}
.vh{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.vh h1{font:600 24px/1.2 var(--f-head);margin:0;text-wrap:balance}
.vh p{margin:2px 0 0;color:var(--ink2)}
.vh .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--mut)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>h2,.ph{font:600 15px var(--f-head);margin:0;padding:14px 16px 10px;display:flex;align-items:center;gap:8px}
.ph .sp{flex:1}
.ph small{font:500 12px var(--f-ui);color:var(--mut)}
/* pastilles d'état */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-good{color:var(--good);background:var(--good-bg)}.p-warn{color:var(--warn);background:var(--warn-bg)}.p-bad{color:var(--bad);background:var(--bad-bg)}.p-info{color:var(--info);background:var(--info-bg)}.p-mut{color:var(--ink2);background:var(--line2)}
/* vues enregistrées + filtres */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:9px 12px;font-weight:600;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .n{font-weight:500;color:var(--mut);margin-left:4px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line2)}
.filters select,.filters input{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 9px;min-width:0}
.filters .sp{flex:1}
.filters small{color:var(--mut)}
/* tableaux */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600;padding:9px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:11px 16px;border-bottom:1px solid var(--line2);white-space:nowrap}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:var(--accent-soft)}
.t .num{text-align:right}
.t .name{font-weight:600;color:var(--ink)}
.t .sub{display:block;font-size:12px;color:var(--mut);font-weight:400}
.who{display:inline-flex;align-items:center;gap:7px}.who .av{width:24px;height:24px;font-size:10px}
.late{color:var(--bad);font-weight:600}
/* aujourd'hui */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi small{display:block;color:var(--ink2);font-weight:500}
.kpi b{display:block;font:600 24px/1.25 var(--f-head);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;font-weight:600;margin-top:2px}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;border-top:1px solid var(--line2)}
.list li .grow{flex:1;min-width:0}
.list li b{font-weight:600}
.list li small{display:block;color:var(--mut)}
.chk{width:18px;height:18px;border:2px solid var(--line);border-radius:5px;flex:none;margin-top:2px;cursor:pointer;background:none;padding:0}
.chk[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
li.done b{text-decoration:line-through;color:var(--mut)}
.drop{margin-top:8px;border:1.5px dashed var(--line);border-radius:8px;padding:8px 10px;text-align:center;color:var(--mut);font-size:12.5px}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.fres{padding-top:8px;margin-top:8px;border-top:1px solid var(--line2)}.fres:first-of-type{border-top:0;margin-top:0}
.fres small{color:var(--mut)}
.miss{margin:8px 0 0;color:var(--warn);font-weight:600;font-size:13px}
@media (pointer:coarse){.drop{display:none}}
.start{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;gap:14px;align-items:flex-start;min-width:0}
.step.first{border:2px solid var(--accent)}
.step .no{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 14px var(--f-head);background:var(--accent-soft);color:var(--accent)}
.step.first .no{background:var(--accent);color:var(--accent-ink)}
.step.ok{border-color:var(--good)}.step.ok .no{background:var(--good);color:#fff}
.step .grow{flex:1;min-width:0}
.step h3{margin:0;font:600 16px var(--f-head)}
.step p{margin:3px 0 10px;color:var(--ink2)}
.step .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.res{margin-top:10px;border-radius:8px;background:var(--bg);border:1px solid var(--line2);padding:10px 12px}
.res ul{margin:6px 0 0;padding-left:18px}.res li{margin:2px 0}
.res b{font-weight:600}
@media (max-width:900px){.start{grid-template-columns:1fr}}
.time{font-weight:700;font-variant-numeric:tabular-nums;width:48px;flex:none;color:var(--accent)}
/* fiche entreprise 3 colonnes */
.crumb{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:13px}
.crumb a{color:var(--accent);text-decoration:none;cursor:pointer;font-weight:600}
.rec{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;gap:16px;align-items:start}
.idc{padding:18px 16px}
.idc .logo{width:52px;height:52px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 18px var(--f-head)}
.idc h1{font:600 20px/1.25 var(--f-head);margin:10px 0 2px}
.idc .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.props{padding:4px 16px 14px}
.prop{padding:8px 0;border-top:1px solid var(--line2)}
.prop small{display:block;font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.prop span{display:block;margin-top:2px;overflow-wrap:anywhere}
.tl{list-style:none;margin:0;padding:6px 16px 16px;position:relative}
.tl li{display:flex;gap:12px;padding:10px 0;position:relative}
.tl li::before{content:"";position:absolute;left:15px;top:42px;bottom:-10px;width:2px;background:var(--line2)}
.tl li:last-child::before{display:none}
.tl .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--line2);color:var(--ink2)}
.tl .ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tl .ic.call{background:var(--info-bg);color:var(--info)}.tl .ic.rdv{background:var(--good-bg);color:var(--good)}.tl .ic.money{background:var(--warn-bg);color:var(--warn)}
.tl .grow{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:9px 12px}
.tl .grow b{font-weight:600}.tl .grow small{float:right;color:var(--mut);font-size:12px;margin-left:8px}
.tl .grow p{margin:4px 0 0;color:var(--ink2)}
.composer{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line2)}
.composer input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel)}
.assoc{padding:0 0 6px}
.assoc h3{font:600 13.5px var(--f-head);margin:0;padding:12px 16px 6px;display:flex;align-items:center}
.assoc h3 .n{color:var(--mut);font:500 12px var(--f-ui);margin-left:6px}
.assoc h3 .sp{flex:1}
.mini{margin:0 12px 8px;border:1px solid var(--line2);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:3px}
.mini b{font-weight:600}.mini small{color:var(--mut)}
.mini .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
/* affaires (colonnes) */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--line2);border-radius:var(--r);display:flex;flex-direction:column;min-height:360px}
.col header{padding:12px 12px 8px}
.col header b{font:600 14px var(--f-head);display:flex;align-items:center;gap:6px}
.col header b .n{font:600 12px var(--f-ui);color:var(--mut)}
.col header small{color:var(--ink2);font-variant-numeric:tabular-nums}
.col .cards{display:flex;flex-direction:column;gap:8px;padding:0 8px 10px;flex:1}
.col.over{outline:2px dashed var(--accent);outline-offset:-4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 11px;cursor:grab;box-shadow:var(--shadow)}
.card b{font-weight:600;display:block}
.card .m{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.card .amt{font-weight:700;font-variant-numeric:tabular-nums}
.card small{color:var(--mut)}
.card select{margin-top:8px;width:100%;border:1px solid var(--line);border-radius:6px;padding:4px;background:var(--panel);font-size:12px}
.card.dragging{opacity:.5}
/* rapports */
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.rgrid .wide{grid-column:1/-1}
.chart{padding:4px 12px 8px;position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:0 16px 4px;font-size:12.5px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,.14);border-radius:8px;padding:8px 10px;font-size:12.5px;min-width:150px;z-index:3;font-variant-numeric:tabular-nums}
.tip b{display:block;margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:12px}
.tip .r i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
details.tbl{padding:0 16px 14px}
details.tbl summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:12.5px}
details.tbl table{margin-top:8px}
details.tbl .t td,details.tbl .t th{padding:6px 10px}
.note{font-size:12.5px;color:var(--ink2);padding:0 16px 14px;margin:0}
.empty{padding:28px 16px;text-align:center;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font:600 16px var(--f-head);margin-bottom:4px}
.toast{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:20}
@media (max-width:1180px){.rec{grid-template-columns:280px minmax(0,1fr)}.rec .right{grid-column:1/-1}}
@media (max-width:900px){
 .app{grid-template-columns:1fr}
 .side{position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;padding:8px max(12px,env(safe-area-inset-left,0px));gap:2px;z-index:6}
 .brand,.navgrp,.side .me{display:none}
 .nav{width:auto;white-space:nowrap;padding:7px 10px}
 .top{position:static}
 .grid2,.rgrid,.rec{grid-template-columns:1fr}
 .demo{display:none}
}
@media (max-width:520px){#create{font-size:0;gap:0;padding:9px}#create svg{width:18px;height:18px}.search kbd{display:none}.top{gap:8px}.view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}.top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}.vh h1{font-size:21px}
 .side{justify-content:space-around;gap:0}.nav{flex-direction:column;gap:3px;padding:6px 7px;width:auto;flex:1;min-width:0;align-items:center}.nav span{display:none}.nav svg{width:22px;height:22px}.nav .cnt{position:absolute;margin-top:-6px;margin-left:14px}.flow,.ngroup{flex:1;justify-content:space-around}}

/* ===== Menu latéral clair ===== */
.ngroup{display:flex;flex-direction:column;gap:2px;padding:6px 0}
.ngroup+.flow,.flow+.ngroup{border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.flow{position:relative;padding:6px 0 4px}
.flowlab{font-size:11px;font-weight:600;color:var(--mut);padding:0 10px 6px}
.fstep{position:relative}
.fstep::before{content:"";position:absolute;left:18px;top:30px;height:calc(100% - 20px);width:2px;background:var(--line);z-index:0}
.fstep:last-child::before{display:none}
.fstep .nav{position:relative;z-index:1}
.fstep .nav svg{background:var(--panel);border-radius:4px}
.side .me{display:flex;align-items:center;gap:10px}
.side .me .grow{flex:1;min-width:0}.side .me b{display:block;font-weight:600}
.gearb{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink2)}
.gearb:hover,.gearb[aria-current="page"]{background:var(--line2);color:var(--ink)}
.gearb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
body.nv-light .side .me b{color:var(--ink)}
@media (max-width:900px){.flowlab,.fstep::before{display:none}.flow,.ngroup{flex-direction:row;display:flex;padding:0;border:0!important;margin:0!important}.side .me{display:flex;margin:0 0 0 auto;border:0;padding:0 4px}.side .me .av,.side .me .grow{display:none}}
/* ===== Variantes de menu (anciennes) ===== */

   PPA_ADAPT.save&&PPA_ADAPT.save();
   const files=res.map(x=>x.error?{name:x.name,pdf:false,r:{err:x.error}}:{name:x.name,pdf:x.pdf,lus:x.lus,nv:x.nv,dbl:x.dbl,sans:x.sans,chk:0});
   const tot={lus:files.reduce((a,f)=>a+(f.lus||0),0),nv:files.reduce((a,f)=>a+(f.nv||0),0)};
   ui.impCalls={files,tot,h:now()};
   const errs=res.filter(x=>x.error).length;
   toast(tot.nv+' fiche(s) ajoutée(s) aux appels'+(errs?' · '+errs+' fichier(s) non lus':''));
   after&&after();
  }catch(e){toast('Import impossible : '+(e.message||e))}
  return;
 }
 const files=[...fl].map((f,i)=>{const pdf=/\.pdf$/i.test(f.name),lus=pdf?13:40+i*12,dbl=pdf?0:3+i%3,sans=pdf?0:2,chk=pdf?5:0;return {name:f.name,pdf,lus,dbl,sans,chk,nv:lus-dbl-sans-chk}});
 const tot={lus:files.reduce((a,f)=>a+f.lus,0),nv:files.reduce((a,f)=>a+f.nv,0)};ui.impCalls={files,tot,h:now()};
 after&&after();toast(tot.nv+' fiches ajoutées aux appels');
}

function groupedBars(box,labels,series,fmt){

 labels.forEach((lb,i)=>{const x0=L+i*step+(step-gw)/2;series.forEach((s,j)=>{const v=s.v[i],x=x0+j*(bw+2),yy=y(v),h=T+ph-yy;g+=`<path d="M${x},${T+ph}V${yy+Math.min(4,h)}q0,-4 4,-4h${bw-8}q4,0 4,4V${T+ph}Z" fill="${s.c}"/>`});

V.qualiopi=()=>{ui.repTab='qual';location.replace('#rapports');return;$v().innerHTML=head('Qualiopi','Indicateurs, preuves et préparation d’audit')+`<section class="panel"><div class="empty"><b>Contenu repris de la version actuelle</b>Même fonctionnement, présenté avec le nouveau gabarit : liste des indicateurs, statut en couleur, preuves rattachées.</div></section>`};
V.parametres=()=>{const T=[['equipe','Équipe & accès'],['auto','Automatisations'],['save','Sauvegardes']];ui.parTab=ui.parTab||'auto';
 const RL=[['Chaque lundi','Import des exports AKTO, OPCO EP et OPCO Commerce','Tâche P1 pour Ayoub jusqu’à validation de l’import dans le CRM'],['Dès l’import','Dossier OPCO sans entreprise','Rattacher le dossier à l’entreprise'],['Dès l’import','Facture OPCO en « Attente pièces règlement »','Tâche urgente + mail d’envoi des justificatifs pré-rédigé'],['30 jours en analyse','Facture OPCO bloquée « En cours d’analyse »','Relance de l’OPCO avec le numéro de dossier'],['Dès l’import','Facture OPCO rejetée non régularisée','Vérifier : doublon ou facture à redéposer'],['J-30 avant la session','Dossier de financement non déposé','Alerte urgente + brouillon de demande de prise en charge'],['J-10 avant la session','Toujours pas d’accord de financement','Relancer l’OPCO avant l’entrée en salle'],['21 jours après le dépôt','OPCO sans réponse','Brouillon de relance avec le numéro de dossier'],['Dès l’inscription','Inscription CPF à valider sur EDOF','Rappel de validation avant l’entrée en formation'],['J-7 avant la session','Convocations non envoyées','Brouillon de convocation + règlement intérieur'],['Pendant la session','Émargements matin et après-midi','Suivi en direct depuis la borne de l’accueil'],['Dès la fin de la session','Session terminée non facturée','Facture en un clic, à l’OPCO (subrogation) ou à l’entreprise'],['Échéance dépassée','Facture impayée','Relance niveau 1, puis 2 à J+10, puis 3 (mise en demeure)'],['J+90 après la formation','Questionnaire entreprise à 3 mois','Envoi pré-rédigé (indicateur 30 Qualiopi)'],['J-60 avant l’échéance','Audit Qualiopi et obligations réglementaires','Plan de préparation + rappels'],['Dès réception','Réclamation ouverte','Traitement et réponse sous 15 jours (indicateur 31)'],['60 jours sans contact','Client à rappeler','Appel de courtoisie et proposition de recyclage']];
 const body=ui.parTab==='auto'?`<div class="dsub">Liaison avec l’automatisation · dossier Drive + mail au commercial</div><div class="dgrid" style="padding:4px 16px 12px"><label class="fld">Adresse du webhook<input value="https://hook.eu1.make.com/g992l0…"></label></div><p class="note">Dès qu’une fiche passe en « RDV fixé », le CRM envoie la fiche à cette adresse : le dossier est créé dans Drive et le commercial reçoit son mail.</p>
  <div class="dsub">Règles actives 17/17</div><ul class="plist">${RL.map(([w,t,a])=>`<li><div class="grow"><b>${t}</b><small>Quand · ${w} — Alors : ${a}</small></div><label class="sw"><input type="checkbox" checked aria-label="${t}"><i></i></label></li>`).join('')}</ul>`
  :ui.parTab==='save'?`<ul class="plist"><li><div class="grow"><b>Sauvegarder maintenant</b><small>Toute la base dans un fichier · et copie automatique chaque nuit dans Google Drive</small></div><button class="btn sm primary">Sauvegarder</button></li><li><div class="grow"><b>Restaurer une sauvegarde</b><small>Fichier « ppa-pilot-donnees »</small></div><button class="btn sm">Restaurer</button></li></ul><div class="dsub">Remises à zéro · irréversibles, sauvegarde automatique avant chaque action</div><ul class="plist">${['Fiches & RDV saisis','Attributions de commissions','Codes d’accès','Droits par fonction','Adresse du webhook','Personnes ajoutées'].map(t=>`<li><div class="grow"><b>${t}</b></div><button class="btn sm ghost">Réinitialiser…</button></li>`).join('')}</ul>`
  :`<ul class="plist">${Object.entries(ROLES).map(([k,r])=>`<li><span class="av">${r.ini}</span><div class="grow"><b>${r.nom}</b><small>${r.lab} · ${k==='terrain'?'auto-entrepreneur':k==='phoneuse'?'salariée':'salarié'} · accès : ${r.v.length} écrans</small></div><button class="btn sm">Modifier</button></li>`).join('')}</ul>`;
 $v().innerHTML=head('Paramètres','Équipe, automatisations et sauvegardes')+`<section class="panel"><div class="tabs" role="tablist">${T.map(([k,l])=>`<button class="tab" role="tab" aria-selected="${ui.parTab===k}" data-pt="${k}">${l}</button>`).join('')}</div>${body}</section>`;
 $v().querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>{ui.parTab=b.dataset.pt;V.parametres()})};

matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(route==='rapports')V.rapports()});

/* recherche locale : ne filtre que la section affichée ; la recherche du haut renvoie toujours vers Entreprises */
ui.lsv={};
const lsKey=()=>{const t=$v().querySelector('.tab[aria-selected="true"]');return route+'|'+(t?t.textContent.trim():'')};
const ROWS='tbody tr:not(.salx),.list li,.plist li,.card,.mini,.ev,.mi,.aglist li';
function lsApply(q){const n=String(q||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();let shown=0,tot=0;
 $v().querySelectorAll(ROWS).forEach(el=>{if(el.closest('.lsearch,.phone,.dhead'))return;tot++;const t=el.textContent.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');const ok=!n||t.includes(n);el.style.display=ok?'':'none';if(ok)shown++});
 $v().querySelectorAll('.vgrp,.col').forEach(g=>{const r=[...g.querySelectorAll(ROWS)];if(r.length)g.style.display=!n||r.some(x=>x.style.display!=='none')?'':'none'});
 const c=$v().querySelector('.lsearch small');if(c)c.textContent=n?shown+' résultat'+(shown>1?'s':''):'';}
function lsInject(){if(route==='aujourdhui'||route==='entreprises'||route.startsWith('fiche')||$v().querySelector('.lsearch'))return;
 const tab=$v().querySelector('.tab[aria-selected="true"]'),sec=tab?tab.textContent.trim():(($v().querySelector('.vh h1')||{}).textContent||'cette page');
 const box=document.createElement('div');box.className='lsearch';box.innerHTML=`<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input type="search" placeholder="Rechercher dans ${esc(sec)}…" aria-label="Rechercher dans ${esc(sec)}"><small></small>`;
 const tabs=$v().querySelector('.panel > .tabs, .tabs');if(tabs)tabs.insertAdjacentElement('afterend',box);else{const vh=$v().querySelector('.vh');(vh||$v().firstChild).insertAdjacentElement('afterend',box)}
 const i=box.querySelector('input'),k=lsKey();i.value=ui.lsv[k]||'';i.oninput=()=>{ui.lsv[lsKey()]=i.value;lsApply(i.value)};if(i.value)lsApply(i.value)}
new MutationObserver(()=>lsInject()).observe(document.getElementById('view'),{childList:true});
/* menu selon le rôle (démonstration) */
document.body.classList.add('nv-light');
(function(){const set=v=>{role=v;try{localStorage.setItem('ppa-role',v)}catch(e){};document.querySelectorAll('[data-rl]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.rl===v)));if(!ROLES[v].v.includes(route.startsWith('fiche')?'entreprises':route)&&route!=='parametres')go('aujourdhui');else render()};
 document.querySelectorAll('[data-rl]').forEach(b=>b.onclick=()=>set(b.dataset.rl));document.querySelectorAll('[data-rl]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.rl===role)))})();
render();
