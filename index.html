<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PPA Pilot"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#14213D"><meta name="robots" content="noindex,nofollow"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png"><link rel="manifest" href="manifest.json"><style>[hidden]{display:none!important}body{margin:0}</style></head><body><title>PPA Pilot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout : rail à gauche · carte holographique plein cadre avec volets repliables · back-office sur la même coque.
   Habillage « Jarvis » par défaut (sombre, cyan), version claire via data-skin="clair". */
/* Layout : rail à gauche · plan type GPS plein cadre avec volets repliables · back-office sur la même coque.
   Ambiance « jour » par défaut (plan clair), « nuit » via data-skin="nuit". */
:root{
  --bg:#F3F5F7; --bg2:#F8FAFB; --panel:#FFFFFF; --panel-solid:#FFFFFF; --panel2:#F2F5F8; --line:#E2E8EE; --line2:#CDD6DF;
  --fg:#0F1B2D; --muted:#566478; --faint:#8793A3;
  --acc:#0F766E; --acc-fg:#FFFFFF; --acc-soft:#DDF1EE; --glow:0 1px 2px rgba(21,34,53,.06);
  --gold:#B7791F; --gold-soft:#FBF1D9;
  --rail:#FFFFFF; --rail-fg:#5F6E80; --rail-act:#EAF4F2;
  --ok:#14A35B; --ok-soft:#DDF5E8; --warn:#D98200; --warn-soft:#FFF0D6; --bad:#E5383B; --bad-soft:#FDE3E3; --info:#2F6FE0; --info-soft:#E4ECFC;
  --scene-bg:#E8ECE6; --overlay:rgba(21,34,53,.40);
  --shadow:0 2px 6px rgba(21,34,53,.06),0 12px 32px rgba(21,34,53,.10);
  --tag-bg:#FFFFFF; --tag-fg:#152235;
  --f-ui:"Inter","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --f-disp:"Manrope","Inter","Segoe UI",system-ui,sans-serif;
  --f-mono:"Manrope","Inter","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
:root[data-skin="nuit"]{
  --bg:#0C1416; --bg2:#111C1F; --panel:#131F22; --panel-solid:#131F22; --panel2:#1A2A2E; --line:#223539; --line2:#2F474C;
  --fg:#E6EEEE; --muted:#9BB0B3; --faint:#6E8789;
  --acc:#2DD4BF; --acc-fg:#062421; --acc-soft:#123F3B; --glow:none;
  --gold:#F2B84B; --gold-soft:#3A2F16;
  --rail:#101A1D; --rail-fg:#8AA3A6; --rail-act:#1A2B2E;
  --ok:#3DD68C; --ok-soft:#163A2A; --warn:#FFB547; --warn-soft:#3B2C14; --bad:#FF6B6E; --bad-soft:#3E1C1F; --info:#7AA7FF; --info-soft:#1C2A4A;
  --scene-bg:#0F191C; --overlay:rgba(0,0,0,.55); --shadow:0 2px 6px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35);
  --tag-bg:#131F22; --tag-fg:#E6EEEE; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:13.5px;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-disp);margin:0;text-wrap:balance;font-weight:900}
.num,td.n,.kv b,.mono{font-variant-numeric:tabular-nums}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);gap:0;padding:0}
/* Rail */
.rail{background:var(--rail);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;overflow-y:auto;scrollbar-width:none}
.rail .logo{margin-bottom:10px}
.rail button{position:relative;width:42px;height:42px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--rail-fg);display:grid;place-items:center;flex:none}
.rail button:hover{background:var(--rail-act);color:var(--acc)}
.rail button.on{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 4px 12px rgba(15,118,110,.35)}
.rail button sup{position:absolute;top:2px;right:1px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#FF4D63;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;line-height:1}
.rail .sp{flex:1}
.rail svg,.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:16px;height:16px}
.tip{position:fixed;z-index:80;background:var(--panel-solid);border:1px solid var(--line2);color:var(--fg);padding:5px 9px;border-radius:7px;font-size:12px;font-weight:700;pointer-events:none;white-space:nowrap}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#0F766E,#0B3B3F);color:#FDE68A;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:15px;letter-spacing:.06em;box-shadow:0 3px 10px rgba(20,36,74,.25);flex:none}
.logo.lg{width:46px;height:46px;font-size:16px;border-radius:13px}
/* Main */
.main{position:relative;overflow:hidden;background:var(--scene-bg);min-width:0}
.scene{position:absolute;inset:0}
.scene canvas{display:block;width:100%;height:100%;touch-action:none}
.scanlines{display:none;position:absolute;inset:0;pointer-events:none;z-index:4;background:repeating-linear-gradient(0deg,rgba(15,118,110,.025) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45));}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.top{position:absolute;z-index:30;top:12px;left:12px;right:12px;height:58px;display:flex;align-items:center;gap:12px;padding:0 12px 0 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{display:block;font-family:var(--f-disp);font-size:17px;font-weight:900}
.brand span{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap}
.cmd{position:relative;flex:1;max-width:560px;display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:0 6px 0 10px;height:40px;color:var(--acc);min-width:0}
.cmd input{flex:1;border:0;background:transparent;outline:0;min-width:0;color:var(--fg)}
.cmd input::placeholder{color:var(--faint)}
.cmd .jv{font-family:var(--f-disp);font-weight:900;font-size:12.5px;color:var(--acc)}
.mic{width:30px;height:30px;border-radius:9px;border:1px solid var(--line2);background:transparent;color:var(--acc);display:grid;place-items:center;flex:none}
kbd{font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted)}
.topr{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;white-space:nowrap;letter-spacing:.03em}
.chip.demo{background:var(--gold-soft);color:var(--gold)}
.live{display:inline-flex;align-items:center;gap:7px;background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:7px 11px;font-weight:800;font-size:12px;font-family:var(--f-mono)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(53,242,166,.5)}70%{box-shadow:0 0 0 8px rgba(53,242,166,0)}100%{box-shadow:0 0 0 0 rgba(53,242,166,0)}}
.ibtn{position:relative;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--fg)}
.ibtn:hover{border-color:var(--acc);color:var(--acc)}
.ibtn sup{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:#FF4D63;color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.user{display:flex;align-items:center;gap:9px;padding-left:4px}
.user b{display:block;font-size:13px}.user span{display:block;font-size:11.5px;color:var(--muted)}
.av{width:36px;height:36px;border-radius:50%;background:var(--acc-soft);border:1px solid var(--acc);color:var(--acc);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;font-family:var(--f-mono)}
.av.sm{width:30px;height:30px;font-size:10.5px}
/* HUD */
.hud{position:absolute;inset:0;pointer-events:none;z-index:10}
.hud>*{pointer-events:auto}
.lp{position:absolute;top:12px;left:12px;width:322px;max-height:calc(100% - 24px);overflow:auto;padding:16px;scrollbar-width:thin;transition:transform .35s ease,opacity .35s}
.rc{position:absolute;top:12px;right:12px;bottom:12px;width:330px;display:flex;flex-direction:column;gap:10px;transition:transform .35s ease,opacity .35s}
.rc .tabs{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px}
.rc .today,.rc .camctl{flex:none}
.dock{position:absolute;left:346px;right:354px;bottom:12px;padding:12px 16px;display:flex;gap:16px;align-items:center;min-width:0;transition:transform .35s ease,opacity .35s}
.hud.hl .lp{transform:translateX(calc(-100% - 20px));opacity:0;pointer-events:none}
.hud.hr .rc{transform:translateX(calc(100% + 20px));opacity:0;pointer-events:none}
.hud.hb .dock{transform:translateY(calc(100% + 20px));opacity:0;pointer-events:none}
.hud.hl .dock{left:12px}.hud.hr .dock{right:12px}
.ptog{position:absolute;z-index:12;width:28px;height:56px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--acc);display:grid;place-items:center;box-shadow:var(--shadow)}
.ptog:hover{border-color:var(--acc)}
.ptog.l{left:338px;top:26px;transition:left .35s}.hud.hl .ptog.l{left:12px}
.ptog.r{right:346px;top:26px;transition:right .35s}.hud.hr .ptog.r{right:12px}
.ptog.b{width:56px;height:24px;left:50%;bottom:4px;transform:translateX(-50%)}
.hud:not(.hb) .ptog.b{bottom:auto;top:auto;display:none}
.dock .dtog{position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:48px;height:22px;border-radius:8px;border:1px solid var(--line2);background:var(--panel-solid);color:var(--acc);display:grid;place-items:center}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--acc);font-family:var(--f-ui)}
.lp-head{display:flex;gap:12px;align-items:flex-start}
.lp-head h2{font-size:20px;margin-top:2px}
.lp-head small{color:var(--muted);font-size:11.5px}
.xbtn{margin-left:auto;width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;flex:none;color:var(--muted)}
.xbtn:hover{border-color:var(--acc);color:var(--acc)}
.status{margin:14px 0 12px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px 12px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--faint)}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}.dot.warn{background:var(--warn);box-shadow:0 0 8px var(--warn)}.dot.bad{background:var(--bad);box-shadow:0 0 8px var(--bad)}.dot.info{background:var(--info);box-shadow:0 0 8px var(--info)}
.mini4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini4 div{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.mini4 span{display:block;color:var(--muted);font-size:11.5px}
.mini4 b{display:block;font-family:var(--f-mono);font-size:17px;margin-top:3px;font-variant-numeric:tabular-nums}
.mini4 b small{font-size:10.5px;color:var(--faint);font-family:var(--f-ui);font-weight:600}
.sect{margin:16px 0 8px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.linkbtn{color:var(--acc);font-weight:700;text-transform:none;letter-spacing:0;font-size:12px;cursor:pointer;background:none;border:0;padding:0}
.row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-bottom:7px;background:transparent;width:100%;text-align:left;color:var(--fg)}
button.row:hover{border-color:var(--acc);background:var(--acc-soft)}
.row .grow{flex:1;min-width:0}
.row b{display:block;font-size:12.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap;background:var(--panel2);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--info-soft);color:var(--info)}.pill.gold{background:var(--gold-soft);color:var(--gold)}.pill.acc{background:var(--acc-soft);color:var(--acc)}
.pill.nodot::before{display:none}
.prio{display:inline-grid;place-items:center;min-width:28px;height:22px;border-radius:7px;font-weight:800;font-size:11px;padding:0 6px;font-family:var(--f-mono)}
.prio.p1{background:var(--bad-soft);color:var(--bad);box-shadow:inset 0 0 0 1px rgba(255,90,110,.35)}.prio.p2{background:var(--warn-soft);color:var(--warn)}.prio.p3{background:var(--info-soft);color:var(--info)}.prio.p4{background:var(--panel2);color:var(--muted)}
.today{padding:14px 16px}
.today h3{font-size:16px;display:flex;justify-content:space-between;align-items:baseline}
.today h3 small{font-family:var(--f-mono);font-weight:500;color:var(--muted);font-size:11px;letter-spacing:0;text-transform:none}
.kpi{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.kpi:last-child{border-bottom:0;padding-bottom:0}
.kpi .ki{width:38px;height:38px;border-radius:11px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;flex:none}
.kpi .kt{flex:1;min-width:0}
.kpi span{display:block;font-size:11.5px;color:var(--muted)}
.kpi b{font-family:var(--f-mono);font-size:19px;font-variant-numeric:tabular-nums}
.kpi b small{font-size:11px;color:var(--faint);font-family:var(--f-ui)}
.kpi em{display:block;font-style:normal;font-size:11px;color:var(--faint)}
.bar{height:5px;border-radius:3px;background:var(--panel2);overflow:hidden;width:64px;flex:none;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.bar.wide{width:100%}
.bar i.gold{background:var(--gold);box-shadow:none}.bar i.ok{background:var(--ok)}.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}.bar i.info{background:var(--info)}
.flash{animation:flash 1.1s ease}
@keyframes flash{0%{background:var(--acc-soft)}100%{background:transparent}}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex:none}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:6px 4px;font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--acc-soft);color:var(--acc);box-shadow:inset 0 0 0 1px var(--line2)}
.seg button small{color:var(--faint);font-weight:600;margin-left:3px;font-family:var(--f-mono)}
.tlist{flex:1;overflow:auto;margin-top:8px;scrollbar-width:thin}
.trow{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:10px;width:100%;border:0;background:transparent;text-align:left;color:var(--fg)}
.trow:hover{background:var(--acc-soft)}
.trow .id{width:44px;flex:none;font-weight:800;font-size:11.5px;line-height:1.15;font-family:var(--f-mono)}
.trow .id small{display:block;color:var(--faint);font-weight:600;font-size:10px}
.trow .grow{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .grow small{display:block;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.camctl{display:flex;justify-content:space-around;padding:6px}
.camctl button{width:38px;height:36px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;color:var(--fg)}
.camctl button:hover{background:var(--acc-soft);color:var(--acc)}
.camctl .sepv{width:1px;background:var(--line);margin:6px 0}
.dock .dh{display:flex;align-items:flex-start;gap:8px;font-weight:900;font-family:var(--f-disp);font-size:14px;white-space:nowrap;border:0;background:transparent;text-align:left;padding:0;flex:none;max-width:180px;color:var(--fg)}
.dock .dh small{display:block;font-family:var(--f-ui);font-weight:600;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;max-width:150px;text-transform:none;letter-spacing:0}
.dock .dbox{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.steps{flex:1;display:flex;align-items:flex-start;min-width:0;overflow:hidden}
.st{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;position:relative;text-align:center}
.st::before{content:"";position:absolute;top:13px;left:-50%;right:50%;height:2px;background:var(--line)}
.st:first-child::before{display:none}
.st.done::before,.st.cur::before{background:var(--acc)}
.st i{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);color:var(--faint);border:1.5px solid var(--line2);font-style:normal;font-weight:800;font-size:11px;font-family:var(--f-mono)}
.st.done i{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
.st.cur i{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft);animation:ring 2s infinite}
@keyframes ring{50%{box-shadow:0 0 0 7px var(--gold-soft)}}
.st b{margin-top:6px;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.st small{font-size:10px;color:var(--faint);white-space:nowrap}
.st:not(.done):not(.cur) b{color:var(--faint)}
/* Labels 3D */
.labels{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font-size:12px;font-weight:700;padding:5px 10px;border-radius:8px;margin-top:-8px}
.lbl.hover{background:var(--tag-bg);color:var(--tag-fg);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.15);border-radius:10px}
.lbl.sel{background:var(--acc);color:#fff;display:flex;gap:8px;align-items:center;box-shadow:0 6px 18px rgba(15,118,110,.35);border-radius:10px}
.lbl.sel em{font-style:normal;opacity:.8}
.lbl.sel::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--acc)}
.lbl.tagp{background:#fff;color:#152235;border:2px solid #E5383B;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.lbl.room{background:#fff;border:1px solid #E1E7EE;color:#152235;font-size:11.5px;padding:7px 11px;border-radius:12px;line-height:1.35;white-space:normal;width:max-content;max-width:230px;box-shadow:0 6px 18px rgba(21,34,53,.15)}
.lbl.room b{display:block;font-family:var(--f-disp);font-size:14px;font-weight:900}
.lbl.room .s{display:inline-block;font-weight:800;font-size:10px;letter-spacing:.06em;padding:1px 7px;border-radius:999px;margin:3px 0}
.lbl.room .s.on{background:#DDF5E8;color:#14A35B}.lbl.room .s.off{background:#EEF2F6;color:#5B6B80}.lbl.room .s.w{background:#FDE3E3;color:#E5383B}
.lbl.route{background:#0F766E;color:#fff;font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:12px;box-shadow:0 6px 16px rgba(15,118,110,.35)}
.lbl.route::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#0F766E}
/* Toasts */
.toasts{position:absolute;z-index:40;top:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;width:min(400px,calc(100% - 24px));pointer-events:none}

.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}

.big{font-family:var(--f-disp);font-size:44px;font-weight:900;line-height:1;color:var(--acc)}

.lpmin{display:block;width:100%;height:16px;margin:-10px 0 4px;border:0;background:transparent;cursor:pointer}.lpmin i{display:block;width:44px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto}.lpmin:hover i{background:var(--acc)}

.ckg{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}

function entPrio(e){

 const mr=db.rdv.find(x=>x.owner==='E8'&&x.date===TODAY&&x.ent===e.id);
 if(mr){r.push(`Mehdi en RDV ici aujourd’hui à ${mr.heure}`);p=Math.min(p,2)}
 al.forEach(a=>{r.push(a.title);if(a.lv==='urgent')p=Math.min(p,1);else if(a.lv==='attention')p=Math.min(p,2)});
 if(e.type==='client'){const c=e.src;const nx=db.sessions.filter(s=>s.client===c.id&&diff(s.fin)>=0).sort((a,b)=>diff(a.debut)-diff(b.debut))[0];
  if(nx){r.push(isActive(nx)?'Formation en cours au centre':`Session ${nx.code} ${rel(nx.debut)}`);if(diff(nx.debut)<=14)p=Math.min(p,2)}
  if(c.last&&diff(c.last)<=-60&&!r.some(x=>x.startsWith('Rappeler'))){r.push(`Sans contact depuis ${-diff(c.last)} j`);p=Math.min(p,2)}
  if(e.ds&&e.ds.length&&!r.length){const last=e.ds.map(d=>d.last).sort().pop();r.push(`${e.ds.length} dossier(s) ${e.ds[0].opco} · ${[...new Set(e.ds.map(d=>d.form))].join(', ')} · dernier le ${fmt(last)}`);if(last&&diff(last)<-300){r.push('Formation il y a plus de 10 mois · proposer le recyclage');p=Math.min(p,2)}}
  const au=nextAudit(c.id);if(au&&diff(au.date)<=30&&!r.some(x=>x.includes(ENTNAME(c.id))&&x.includes('udit'))){r.push(`${AUDIT_T[au.type]} ${rel(au.date)} (${fmt(au.date)})`);if(diff(au.date)<=7)p=Math.min(p,2)}
  if(!r.length)r.push('Client à fidéliser · proposer un recyclage ou une autre formation')}
 else{const d=e.src;
  if(d.etape==='Négociation'){p=1;r.unshift(`Négociation en cours · ${eur(d.montant)} à conclure`)}
  else if(d.etape==='RDV fixé'){p=Math.min(p,d.rdv&&diff(d.rdv)<=1?1:2);if(!mr)r.unshift(d.rdv?`RDV ${rel(d.rdv)} (${fmt(d.rdv)})`:'RDV fixé')}
  else if(d.etape==='Devis envoyé'){p=Math.min(p,2);if(!al.length)r.unshift(`Devis envoyé ${rel(d.maj)} · ${eur(d.montant)}`)}
  else if(!mr)r.unshift(`À appeler · ${d.offre}`)}
 e.p=p;e.reasons=r;return e;
}

/* ---------- Mehdi : tournée du jour ---------- */
function mehdiDay(){
 const st=db.rdv.filter(x=>x.owner==='E8'&&x.date===TODAY).sort((a,b)=>a.heure.localeCompare(b.heure)).map(x=>{const a=hToM(x.heure),b=a+(x.duree||45);return {...x,a,b}});
 const n=nowMin();st.forEach(x=>x.etat=n>=x.b?'fait':n>=x.a?'en cours':'à venir');
 const P=st.length;let pos={k:0,frac:0,phase:'base',label:P?`Au centre · départ ${mToH(st[0].a-40)}`:'Au centre · pas de RDV aujourd’hui'};
 if(P){const leave=k=>k===0?st[0].a-40:st[k-1].b,arrive=k=>k<P?st[k].a:st[P-1].b+40;
  for(let k=0;k<=P;k++){const l=leave(k),a=arrive(k);
   if(n<l)break;
   if(n<a){pos={k,frac:(n-l)/(a-l),phase:'route',label:k<P?`En route vers ${ENTNAME(st[k].ent)} · arrivée ${st[k].heure}`:'Retour au centre'};break}
   if(k<P&&n<st[k].b){pos={k:k+1,frac:0,phase:'rdv',label:`En RDV chez ${ENTNAME(st[k].ent)} jusqu’à ${mToH(st[k].b)}`};break}
   if(k===P){pos={k:P+1,frac:0,phase:'base',label:'Tournée terminée · retour au centre'}}
  }}
 return {rdv:st,pos};
}

function workdays(a,b){const out=[];const d=parse(a),e=parse(b);while(d<=e){if(d.getDay()%6!==0)out.push(iso(d));d.setDate(d.getDate()+1)}return out.length?out:[a]}

async function genDocs(sid,onStep){
 const s=SE(sid),c=CL(s.client),tr=EM(s.formateur),L=s.stagList;
 await loadLib('zip');
 const days=workdays(s.debut,s.fin),nd=days.length,J=nd>1?'S':'';
 const base={FORMATEUR:`${tr.civ||'Mr'} ${tr.nom}`,E_NOM:c.nom,E_ADRESSE:c.adresse||c.ville||'',E_SIRET:c.siret||'',E_SECTEUR:c.secteur||'',E_REPRESENTANT:c.contact||'',
  DUREE:`${s.heures} heures (${nd} jour${nd>1?'s':''})`,DUREE_JOURS:`${nd} JOUR${J} (${s.heures} heures)`,DUREE_ATT:`${s.heures}H00 ( ${nd} JOUR${J} )`,HORAIRES:'8H30 – 17h30',
  DATES:nd>1?`${fmt(s.debut)} au ${fmt(s.fin)}`:fmt(s.debut),LIEU:s.lieu||LIEU_DEF,EFFECTIF:String(L.length),NB:String(L.length),PU:eur(s.prix/Math.max(1,L.length)),TOTAL_HT:eur(s.prix),
  DATE_DOC:fmt(TODAY),DATE_FIN:fmt(s.fin),J1:fmt(days[0]),J2:fmt(days[1]||days[0]),NOTE_QCM:'',NOTE_OBJ:'',NOTE_FIN:'',COMMENT:''};
 const sv=x=>({S_NOM:x.n,S_EMAIL:x.email,S_TEL:x.tel,S_POSTE:x.poste,S_NAISS:x.naiss,S_ADRESSE:x.adresse});
 if(!window.__TPL){const r=await fetch('tpl/templates.json');if(!r.ok)throw new Error('Modèles introuvables');window.__TPL=await r.json()}
 const b64=n=>{const bin=atob(window.__TPL[n.replace('tpl/','')]);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u};
 const out=new JSZip();const folder=`PPA_${s.prog}_${slug(c.nom)}_${s.debut}`;let count=0;
 for(const t of TPLS){
  if(!window.__TPL[t.f.replace('tpl/','')])throw new Error('Modèle introuvable : '+t.f);const buf=b64(t.f);const inst=[];
  if(t.per==='stag')L.forEach(x=>inst.push([`${t.n}_${slug(t.t)}_${slug(x.n)}.docx`,{...sv(x),DATE_QCM:t.n==='05'?fmt(days[0]):fmt(s.fin)}]));
  else if(t.per==='group'){const g=Math.max(1,Math.ceil(L.length/6));for(let k=0;k<g;k++){const v={};for(let i=0;i<6;i++)v['S'+(i+1)]=L[k*6+i]?L[k*6+i].n:'';inst.push([`${t.n}_${slug(t.t)}${g>1?'_groupe'+(k+1):''}.docx`,v])}}
  else inst.push([`${t.n}_${slug(t.t)}.docx`,{}]);

  onStep&&onStep(t);
 }

const COLMAP={num:['numéro facture','numero facture','n° facture'],ref:['référence facture','reference facture'],date:['date facture'],recu:['date réception','date reception'],etat:['etat de la facture','état de la facture','statut','etat'],paye:['date de paiement'],ht:['facture - montant ht','montant ht'],dossier:['numéro dossier / dr','numero dossier / dr','numéro dossier','n° dossier'],refint:['référence interne dossier / dr','référence interne']};
const toIso=v=>{if(!v)return null;if(v instanceof Date)return iso(v);if(typeof v==='number'){const d=new Date(Math.round((v-25569)*864e5));return iso(d)}const m=String(v).match(/(\d{2})\/(\d{2})\/(\d{4})/);if(m)return `${m[3]}-${m[2]}-${m[1]}`;const m2=String(v).match(/(\d{4})-(\d{2})-(\d{2})/);return m2?m2[0]:null};
async function parseExport(file,opco){
 await loadLib('xlsx');
 const wb=XLSX.read(await file.arrayBuffer(),{cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];
 const rows=XLSX.utils.sheet_to_json(ws,{defval:null,raw:true});if(!rows.length)throw new Error('Le fichier est vide.');
 const heads=Object.keys(rows[0]);const find=k=>heads.find(h=>COLMAP[k].includes(String(h).trim().toLowerCase()));
 const H={};Object.keys(COLMAP).forEach(k=>H[k]=find(k));
 const missing=['num','etat','ht','dossier'].filter(k=>!H[k]);
 if(missing.length)return {error:`Colonnes non reconnues dans cet export (${missing.join(', ')}). Colonnes trouvées : ${heads.slice(0,12).join(' · ')}`};
 const list=rows.filter(r=>r[H.num]!=null).map(r=>({opco,num:String(r[H.num]),ref:String(r[H.ref]??r[H.num]),date:toIso(r[H.date]),recu:toIso(r[H.recu])||toIso(r[H.date]),etat:String(r[H.etat]||'').trim(),paye:toIso(r[H.paye]),ht:+r[H.ht]||0,dossier:String(r[H.dossier]||''),refint:String(r[H.refint]||'')}));
 const old=db.opcoInv.filter(x=>x.opco===opco);const om=new Map(old.map(x=>[x.num+'|'+x.date,x]));
 const nouv=[],chg=[],same=[];list.forEach(x=>{const o=om.get(x.num+'|'+x.date);if(!o)nouv.push(x);else if(o.etat!==x.etat)chg.push({o,x});else same.push(x)});
 return {list,nouv,chg,same,file:file.name,opco};
}

function mp2Pt(ville,id){const c=cityOf(ville);if(!c)return null;let h=0;String(id).split('').forEach(ch=>h=(h*31+ch.charCodeAt(0))>>>0);const a=(h%360)*Math.PI/180,r=.004+((h>>9)%100)/100*.012;return [c.ll[1]+Math.cos(a)*r*1.6,c.ll[0]+Math.sin(a)*r]}

 const E=ui.ents;const FBi=E.map(e=>({com:comOfId(e.id),loc:e.sect}));const FB=fbar(FBi);let miss=0;
 const feats=[];E.forEach((e,i)=>{if(!FB.pass(FBi[i]))return;const c=mp2Pt(e.ville,e.id);if(!c){miss++;return}feats.push({type:'Feature',geometry:{type:'Point',coordinates:c},properties:{id:e.id,nom:e.nom,ville:e.ville,p:e.p,val:e.val||0,w:Math.max(.2,Math.min(1,(e.val||0)/8000)),type:e.type,act:e.act||'',sect:e.sect,col:MP2_PRIO[e.p]||'#868e96',why:(e.reasons&&e.reasons[0])||''}})});

 return {pts:{type:'FeatureCollection',features:feats},p1:{type:'FeatureCollection',features:feats.filter(x=>x.properties.p===1)},sec:{type:'FeatureCollection',features:secs},miss,n:feats.length,secs};
}

 if(!L.length)return {line:null,pts:[],d:''};const d0=L.map(x=>x.d).sort()[0];const day=L.filter(x=>x.d===d0).sort((a,b)=>a.h.localeCompare(b.h));

}

function cliChain(c){const d=(db.dos||{})[c.id]||{},h0=d.has||{},hb=d.hb||{},sal=d.sal||[];const h=new Proxy({},{get:(_,k)=>{k=String(k);const v=(h0[k]||0)-((k==='identite'||k.startsWith('paie:'))?0:(hb[k]||0));return v>0?v:0}});const ss=db.sessions.filter(s=>s.client===c.id&&(!d.since||(s.debut||'')>=d.since));const fs=db.factures.filter(f=>ss.some(s=>s.id===f.session));
 const S=[()=>{const m=[];if(!h.kbis)m.push('Kbis');if(!h.identite)m.push('CNI du gérant');if(!sal.length)m.push('au moins un salarié');sal.forEach((s,i)=>{const n=[s.prenom,s.nom].filter(Boolean).join(' ')||'salarié n°'+(i+1);if(!s.nom)m.push('nom du salarié n°'+(i+1));if(!s.naiss)m.push('date de naissance de '+n);if(!h['paie:'+s.id])m.push('fiche de paie de '+n)});return m},
  ()=>{const m=[];if(!h.convention)m.push('convention de formation');if(!h.opco_envoi)m.push('envoi OPCO');return m},
  ()=>h.opco_accord?[]:['accord de prise en charge'],

  ()=>(h.facture||fs.length)?[]:['facture client'],
  ()=>(fs.length&&fs.every(f=>f.paye))?[]:['paiement à pointer']];
 const all=S.map(f=>f());let a=all.findIndex(m=>m.length);if(a<0)a=S.length;const miss=all[a]||[];
 const man=CST.indexOf(c.statut);const idx=Math.max(a,man);return {idx,auto:a,forced:man>a,st:CST[idx],miss:idx===a?miss:[],all}}

function sendLead(d){
 const url=(db.hook||'').trim();
 if(!url){toast({title:'Automatisation non reliée',sub:'Collez l’adresse du webhook dans « Automatisations »',kind:'warn'});return false}
 if(!d.dossier){const t=new Date(),z=n=>String(n).padStart(2,'0');d.dossier='D-'+String(t.getFullYear()).slice(2)+z(t.getMonth()+1)+z(t.getDate())+'-'+z(t.getHours())+z(t.getMinutes())+z(t.getSeconds())}
 if(d.envoye)return true;
 const com=EM(d.commercial);
 const p=new URLSearchParams({id_dossier:d.dossier,etablissement:d.nom,ville:d.ville||'',code_postal:d.cp||'',gerant:d.contact||'',adresse:d.adresse||'',effectif:d.eff||'',telephone:d.tel||'',source:ORI_L[d.origine||'centre'],rdv_date:((d.rdv||'')+' '+(d.rdvH||'')).trim(),commercial_nom:com.nom==='—'?'':com.nom,commercial_email:com.email||'',email_contact:d.email||'',siret:d.siret||'',ape:d.ape||'',exploitant:d.rs||'',activite:d.acti||d.act||'',alimconfiance:((d.alim||'')+(d.alimDate?' le '+fmt(d.alimDate):'')).trim(),raison_appel:d.raison||'',angle:d.angle||'',services:(d.services||[]).join(' • '),priorite:(LPRIO.find(x=>x[0]===d.priorite)||['','' ])[1],telephoneuse:EM(d.phoneuse).nom==='—'?'':EM(d.phoneuse).nom,contact_appel:(d.suivi&&d.suivi.contact)||'',notes:(d.suivi&&d.suivi.notes)||''});
 try{fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:p.toString()}).then(()=>{},()=>{})}catch(e){}

/* ---------- Greffe : commissions (calculées à chaque paiement OPCO) ---------- */
function commLines(){
 const L=[];
 dossiers().forEach(d=>{
  const c=d.client?db.clients.find(k=>k.id===d.client):null;
  d.inv.filter(x=>x.etat==='Payé'&&x.paye).forEach(x=>{
   const ori=c&&c.origine,b=ori?BAREME[ori]:null;
   L.push({mois:x.paye.slice(0,7),date:x.paye,dossier:d.dossier,form:d.form,client:c?c.nom:'Dossier non rattaché',cid:c?c.id:null,ht:x.ht||0,ori,
    tel:b&&c.phoneuse?{id:c.phoneuse,m:(x.ht||0)*b.tel}:null,com:b&&c.commercial?{id:c.commercial,m:(x.ht||0)*b.com}:null,ok:!!(b&&c.commercial)})})});
 return L.sort((a,b)=>b.date.localeCompare(a.date));
}

 return `<div class="ph"><div><span class="eyebrow">Finance</span><h1>Commissions</h1><p>Une commission est due dès que l’OPCO paie, sur le montant HT versé. Relevé arrêté en fin de mois, un par personne.</p></div>

 <div class="card panel"><h3>Commissions à payer</h3><div class="num" style="font-size:28px;font-weight:900">${eur(cm)}</div></div>

 <div class="grid g21"><div class="card panel"><h3>Relevé par personne <small>${monthName(ui.comM)}</small></h3>${Object.values(by).length?`<table class="tbl"><thead><tr><th>Personne</th><th>Rôle</th><th>Dossiers</th><th style="text-align:right">À payer</th></tr></thead><tbody>${Object.values(by).sort((a,b)=>b.m-a.m).map(r=>`<tr><td><b>${esc(EM(r.id).nom)}</b></td><td>${esc(EM(r.id).role)}</td><td>${r.n}</td><td style="text-align:right"><b>${eur(r.m)}</b></td></tr>`).join('')}</tbody></table>`:'<div class="note">Aucun paiement OPCO commissionnable ce mois-ci.</div>'}
 <div class="note" style="margin-top:12px">Barème (HT versé par l’OPCO) : lead du centre → téléprospectrice 5 %, commercial 10 % · client du commercial → commercial 15 % · renouvellement → commercial 15 %. Le formateur est salarié : aucune commission.</div></div>
 <div class="card panel"><h3>Détail des paiements</h3>${M.length?`<table class="tbl"><thead><tr><th>Dossier</th><th>Origine</th><th style="text-align:right">HT</th><th style="text-align:right">Tél.</th><th style="text-align:right">Com.</th></tr></thead><tbody>${M.map(x=>`<tr><td><b>${esc(x.client)}</b><small style="display:block;color:var(--muted)">${esc(x.form)} · payé le ${fmt(x.date)}</small></td><td>${x.ori?esc(ORI_L[x.ori]):'<span class="pill bad">À attribuer</span>'}</td><td style="text-align:right">${eur(x.ht)}</td><td style="text-align:right">${x.tel&&x.tel.m?eur(x.tel.m):'—'}</td><td style="text-align:right">${x.com?eur(x.com.m):'—'}</td></tr>`).join('')}</tbody></table>`:'<div class="note">Rien à afficher.</div>'}</div></div>`;

const DEF_ACCESS={formateur:['cockpit','sessions','usine','agenda'],phoneuse:['cockpit','leads','tdb'],terrain:['cockpit','leads','portefeuille','clients','agenda','carte2'],admin:['cockpit','leads','sessions','usine','opco','factures','agenda','qualiopi','clients']};

function hp(x){let h=5381;const t='ppa|'+x;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return String(h>>>0)}
function setPin(id,v){v=(v||'').trim();db.pins=db.pins||{};db.pinsH=db.pinsH||{};if(v&&/^\d{4}$/.test(v)){const me=db.equipe.find(e=>e.id===id);const clash=me&&db.equipe.find(e=>e.id!==id&&e.type===me.type&&db.pinsH[e.id]===hp(v));if(clash){toast({title:'Code déjà utilisé par '+clash.nom,sub:'Deux personnes de la même fonction doivent avoir des codes différents',kind:'warn'});return false}}if(v&&!/^\d{4}$/.test(v)){toast({title:'Le code doit faire 4 chiffres',kind:'warn'});return false}if(v){db.pins[id]=v;db.pinsH[id]=hp(v)}else{delete db.pins[id];delete db.pinsH[id]}save();return true}

function curUser(){const w=store.get('who',null);
 if(w==='direction')return{id:'direction',kind:'direction',nom:'Rachid',role:'Direction',ini:'RA'};
 const m=w&&db.equipe.find(e=>e.id===w);
 if(m&&ACCESS[m.type])return{id:m.id,kind:m.type,nom:m.nom.split(' ')[0],role:m.role,ini:m.nom.slice(0,2).toUpperCase()};
 return{id:'direction',kind:'direction',nom:'Rachid',role:'Direction',ini:'RA'}}

 g.hidden=false;let pick=null;const err=m=>{$('#gErr').textContent=m;$('#gErr').hidden=false};

 <div class="grid g3">${RZ.filter(r=>!r.danger).map(r=>{const n=r.n();return `<div class="card panel"><h3>${r.t}</h3><p style="color:var(--muted);font-size:13px;min-height:62px">${r.d}</p><div class="kv"><span>Concerné</span><b>${n} ${r.u}</b></div><div class="acts" style="margin-top:12px"><button type="button" class="btn" data-a="rzAsk" data-k="${r.k}" ${n?'':'disabled'}>${n?'Réinitialiser…':'Rien à réinitialiser'}</button></div></div>`}).join('')}</div>
 <div class="sect" style="color:var(--bad)">Zone dangereuse</div>
 ${RZ.filter(r=>r.danger).map(r=>`<div class="card panel" style="border:1.5px solid var(--bad)"><h3 style="color:var(--bad)">${r.t}</h3><p style="color:var(--muted);font-size:13px">${r.d}</p><div class="acts"><button type="button" class="btn" style="background:var(--bad);color:#fff" data-a="rzAsk" data-k="${r.k}">Tout réinitialiser…</button></div></div>`).join('')}`;
}
function rzAsk(k){
 const r=RZ.find(x=>x.k===k);if(!r)return;const md=$('#modal');md.hidden=false;
 md.innerHTML=`<form class="mbox" id="fRz"><header><div style="flex:1"><span class="eyebrow" style="color:var(--bad)">Action irréversible</span><h3>${r.t}</h3></div><button type="button" class="xbtn" data-a="closeModal" aria-label="Fermer">${ic('x','s')}</button></header>
 <div class="note warn">${r.d}</div><div class="note" style="margin-top:8px">Concerné : <b>${r.n()} ${r.u}</b>. Une sauvegarde est téléchargée automatiquement avant l’opération.</div>
 <div class="fl" style="margin-top:12px"><label for="rzW">Pour valider, tapez <b>${r.w}</b></label><input id="rzW" autocomplete="off"></div>
 <label style="display:flex;gap:8px;align-items:center;margin:10px 0;font-size:13px"><input type="checkbox" id="rzC"> Je comprends que c’est irréversible</label>
 <div class="mfoot"><button type="button" class="btn" data-a="closeModal">Annuler</button><button type="submit" class="btn" id="rzGo" disabled style="background:var(--bad);color:#fff">Réinitialiser</button></div></form>`;
 const up=()=>{$('#rzGo').disabled=!($('#rzC').checked&&$('#rzW').value.trim().toUpperCase()===r.w)};$('#rzW').oninput=up;$('#rzC').onchange=up;
 $('#fRz').onsubmit=e=>{e.preventDefault();up();if($('#rzGo').disabled)return;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download=`ppa-sauvegarde-avant-${r.k}-${TODAY}.json`;a.click();
  r.run();log('Réinitialisation · '+r.t);save();closeModal();ui.sel=null;ui.inside=false;refresh();
  const md2=$('#modal');md2.hidden=false;md2.innerHTML=`<div class="mbox" style="text-align:center"><div style="font-size:42px;line-height:1;color:var(--ok)">✓</div><h3 style="margin:8px 0 4px">${r.t}</h3><p style="margin:0 0 12px;color:var(--muted)">Réinitialisation effectuée. La sauvegarde a été téléchargée.</p><div class="mfoot" style="justify-content:center"><button type="button" class="btn primary" data-a="closeModal">OK</button></div></div>`};
 setTimeout(()=>$('#rzW').focus(),50);
}

/* ====== Portefeuille clients (commercial) et performance téléprospection ====== */
const PFS=[['rdv','RDV prévu','#2563EB'],['devis','Devis envoyé','#7048e8'],['reflexion','En réflexion','#f08c00'],['signe','Signé','#12b886'],['refus','Refusé','#e03131']];
const PFD={rdv:'RDV le',devis:'Devis envoyé le',reflexion:'Rappel le',signe:'Signé le',refus:'Refus le'};
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const moisL=m=>m.length===4?m:MOIS[+m.slice(5)-1]+' '+m.slice(0,4);
const addYear=d=>(+d.slice(0,4)+1)+d.slice(4);
function pfInfo(d){const st=(d.pf&&d.pf.statut)||'rdv';const date=(d.pf&&d.pf.date)||(st==='rdv'?d.rdv:'')||'';return{st,date,relance:(d.pf&&d.pf.relance)||((st==='signe'||st==='refus')&&date?addYear(date):''),notes:(d.pf&&d.pf.notes)||''}}
const pfPill=st=>{const x=PFS.find(y=>y[0]===st)||PFS[0];return `<span class="pill" style="background:color-mix(in srgb,${x[2]} 16%,transparent);color:${x[2]};font-weight:800">${x[1]}</span>`};
function csvDl(name,rows){const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;a.click()}
const selUi=(key,list,cur,label)=>`<select class="btn" data-uif="${key}" aria-label="${label}">${list.map(([k,l])=>`<option value="${esc(k)}" ${String(cur)===String(k)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
const yearsOf=L=>[...new Set(L.map(x=>x.slice(0,4)).filter(Boolean))].sort().reverse();

function pfList(){const u=curUser();let L=db.deals.filter(d=>d.envoye&&d.commercial);if(u.kind==='terrain')L=L.filter(d=>d.commercial===u.id);else if(ui.pfC)L=L.filter(d=>d.commercial===ui.pfC);return L}
function V_portefeuille(){
 const u=curUser(),all=pfList(),dateOf=d=>(d.rdv||d.envoye||'').slice(0,10);
 const ys=yearsOf(all.map(dateOf));const L=all.filter(d=>(!ui.pfY||dateOf(d).startsWith(ui.pfY))&&(!ui.pfS||pfInfo(d).st===ui.pfS)).sort((a,b)=>dateOf(b).localeCompare(dateOf(a)));
 const n=st=>all.filter(d=>pfInfo(d).st===st).length,sg=n('signe'),rf=n('refus'),enc=all.length-sg-rf;
 const rec=all.filter(d=>{const r=pfInfo(d).relance;return r&&diff(r)<=60}).length;
 return `<div class="ph"><div><span class="eyebrow">Commercial</span><h1>Portefeuille clients</h1><p>${u.kind==='terrain'?'Chaque rendez-vous pris pour vous entre ici, signé ou non. Il reste dans votre portefeuille et sera à recontacter l’an prochain.':'Chaque RDV envoyé devient un client du portefeuille de son commercial, signé ou non.'}</p></div>
 <div class="acts">${u.kind==='direction'?selUi('pfC',[['','Tous les commerciaux'],...db.equipe.filter(e=>e.type==='terrain').map(e=>[e.id,e.nom])],ui.pfC||'','Commercial'):''}${selUi('pfY',[['','Toutes les années'],...ys.map(y=>[y,y])],ui.pfY||'','Année')}${selUi('pfS',[['','Tous les statuts'],...PFS.map(x=>[x[0],x[1]])],ui.pfS||'','Statut')}<button class="btn" data-a="pfCsv">Exporter (CSV)</button></div></div>
 <div class="grid g4" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"><div class="card tile"><span>Clients au portefeuille</span><b>${all.length}</b></div><div class="card tile"><span style="color:#12b886">Signés</span><b>${sg}</b></div><div class="card tile"><span style="color:#e03131">Refusés</span><b>${rf}</b></div><div class="card tile"><span>En cours</span><b>${enc}</b></div><div class="card tile"><span>Taux de signature</span><b>${sg+rf?Math.round(sg/(sg+rf)*100)+' %':'—'}</b><em>signés / décidés</em></div><div class="card tile ${rec?'alert':''}"><span>À recontacter</span><b>${rec}</b><em>dans les 60 jours</em></div></div>
 <div class="sect">Fiches entreprises · ${L.length}</div>
 ${L.length?`<div class="grid g3">${L.map(d=>{const pi=pfInfo(d),c=(PFS.find(x=>x[0]===pi.st)||PFS[0])[2];return `<div class="card panel fncard" style="--fc:${c}"><div class="pcard"><div style="min-width:0;flex:1"><b style="font-size:16px">${esc(d.nom)}</b><small style="display:block;color:var(--muted)">${esc(d.act||'')}${d.acti?' · '+esc(d.acti):''}</small><div style="margin-top:6px">${pfPill(pi.st)}${pi.date?` <small>${PFD[pi.st]} ${fmt(pi.date)}</small>`:''}</div></div></div>
 <div class="kv" style="margin-top:12px"><span>Adresse</span><b style="font-size:12px">${esc([d.adresse,d.cp,d.ville].filter(Boolean).join(', ')||'—')}</b><span>Téléphone</span><b>${esc(d.tel||'—')}</b><span>E-mail</span><b style="font-size:12px;word-break:break-all">${esc(d.email||'—')}</b><span>Dirigeant</span><b>${esc(d.contact||'—')}${d.dirQ?' ('+esc(d.dirQ)+')':''}</b><span>RDV pris</span><b>${d.rdv?fmt(d.rdv)+(d.rdvH?' · '+esc(d.rdvH):''):'—'}</b>${u.kind==='direction'?`<span>Commercial</span><b>${esc(EM(d.commercial).nom)}</b>`:''}<span>À recontacter</span><b>${pi.relance?fmt(pi.relance):'—'}</b></div>
 ${pi.notes?`<div class="note" style="margin-top:10px">${esc(pi.notes)}</div>`:''}<div class="acts" style="margin-top:12px"><button type="button" class="btn sm primary" data-a="pfOpen" data-id="${d.id}">Mettre à jour</button></div></div>`}).join('')}</div>`:'<div class="note">Aucun client pour le moment : ils arrivent ici dès qu’un RDV vous est envoyé.</div>'}`;
}
function openPf(id){
 const d=db.deals.find(x=>x.id===id);if(!d)return;const pi=pfInfo(d),md=$('#modal');md.hidden=false;
 md.innerHTML=`<form class="mbox" id="fPf" data-id="${id}"><header><div style="flex:1"><span class="eyebrow">Portefeuille · ${esc(EM(d.commercial).nom)}</span><h3>${esc(d.nom)}</h3></div><button type="button" class="xbtn" data-a="closeModal" aria-label="Fermer">${ic('x','s')}</button></header>
 <div class="note">${esc([d.adresse,d.cp,d.ville].filter(Boolean).join(', '))} · RDV ${d.rdv?fmt(d.rdv):'—'}${d.rdvH?' à '+esc(d.rdvH):''} · dossier ${esc(d.dossier||'')}</div>
 <div class="frow" style="margin-top:10px"><div class="fl"><label for="pfTel">Téléphone</label><input id="pfTel" value="${esc(d.tel||'')}" autocomplete="off"></div><div class="fl"><label for="pfMail">E-mail</label><input id="pfMail" type="email" value="${esc(d.email||'')}" autocomplete="off"></div></div>
 <div class="sect">Statut</div><div class="stt">${PFS.map(x=>`<label><input type="radio" name="pfSt" value="${x[0]}" ${pi.st===x[0]?'checked':''}>${x[1]}</label>`).join('')}</div>
 <div class="frow" style="margin-top:10px"><div class="fl"><label for="pfDate" id="pfDl">${PFD[pi.st]}</label><input id="pfDate" type="date" value="${esc(pi.date)}"></div><div class="fl"><label for="pfRel">À recontacter le</label><input id="pfRel" type="date" value="${esc(pi.relance)}"></div></div>
 <div class="fl"><label for="pfNotes">Notes (motif du refus, montant du devis…)</label><textarea id="pfNotes" rows="3" style="width:100%">${esc(pi.notes)}</textarea></div>
 <div class="note">Signé ou refusé : la relance de l’an prochain se propose automatiquement un an après la date.</div>
 <div class="mfoot"><button type="button" class="btn" data-a="closeModal">Annuler</button><button type="submit" class="btn primary">Enregistrer</button></div></form>`;
 const f=$('#fPf');f.querySelectorAll('input[name=pfSt]').forEach(r=>r.onchange=()=>{const st=r.value;$('#pfDl').textContent=PFD[st];if(!$('#pfDate').value)$('#pfDate').value=TODAY;if((st==='signe'||st==='refus')){$('#pfRel').value=addYear($('#pfDate').value)}});
 $('#pfDate').onchange=()=>{const st=(f.querySelector('input[name=pfSt]:checked')||{}).value;if(st==='signe'||st==='refus')$('#pfRel').value=$('#pfDate').value?addYear($('#pfDate').value):''};
}
document.addEventListener('submit',e=>{const f=e.target;if(f.id!=='fPf')return;e.preventDefault();const d=db.deals.find(x=>x.id===f.dataset.id);if(!d)return;const g=i=>f.querySelector('#'+i).value.trim();
 const st=(f.querySelector('input[name=pfSt]:checked')||{}).value||'rdv';d.tel=g('pfTel');d.email=g('pfMail');d.pf={statut:st,date:g('pfDate'),relance:g('pfRel'),notes:g('pfNotes')};d.maj=TODAY;
 log(`Portefeuille · ${d.nom} · ${(PFS.find(x=>x[0]===st)||[0,st])[1]}`);save();closeModal();refresh();toast({title:`${d.nom} mis à jour`,sub:(PFS.find(x=>x[0]===st)||[0,''])[1],kind:'ok'})});
function pfCsv(){const rows=[['Année','Mois','Date RDV','Établissement','Ville','Code postal','Adresse','Téléphone','E-mail','Dirigeant','Statut','Date du statut','À recontacter le','Commercial','Téléprospectrice','Dossier','Notes']];
 pfList().map(d=>({d,pi:pfInfo(d)})).sort((a,b)=>PFS.findIndex(x=>x[0]===a.pi.st)-PFS.findIndex(x=>x[0]===b.pi.st)||(a.d.rdv||'').localeCompare(b.d.rdv||'')).forEach(({d,pi})=>{const r=(d.rdv||d.envoye||'').slice(0,10);rows.push([r.slice(0,4),r.slice(5,7),r,d.nom,d.ville,d.cp||'',d.adresse||'',d.tel||'',d.email||'',d.contact||'',(PFS.find(x=>x[0]===pi.st)||[0,''])[1],pi.date,pi.relance,EM(d.commercial).nom,EM(d.phoneuse).nom==='—'?'':EM(d.phoneuse).nom,d.dossier||'',pi.notes])});
 csvDl('portefeuille-clients-'+TODAY+'.csv',rows)}

/* ---- Performance téléprospection ---- */
function tdList(){const u=curUser();let L=db.deals.filter(d=>d.lead||(d.dossier&&d.envoye));if(u.kind==='phoneuse')L=L.filter(d=>d.phoneuse===u.id);else if(ui.tdU)L=L.filter(d=>d.phoneuse===ui.tdU);return L}
const tdDate=d=>((d.suivi&&d.suivi.date)||(d.envoye||'').slice(0,10)||d.maj||'').slice(0,10);
const tdSt=d=>(d.suivi&&d.suivi.statut)||'';
function tdStats(L){const called=L.filter(d=>tdSt(d)!=='').length,rdv=L.filter(d=>d.envoye).length;return{n:L.length,called,inter:L.filter(d=>tdSt(d)==='interesse').length,rdv,non:L.filter(d=>tdSt(d)==='non').length,rap:L.filter(d=>tdSt(d)==='rappeler').length,taux:called?Math.round(rdv/called*100):null}}
function V_tdb(){
 const u=curUser(),all=tdList(),mode=ui.tdM||'mois';const per=all.map(tdDate).concat(TODAY.slice(0,7));
 const months=[...new Set(per.map(x=>x.slice(0,7)))].sort().reverse(),years=yearsOf(per);
 const P=(ui.tdP&&(mode==='mois'?ui.tdP.length===7:ui.tdP.length===4))?ui.tdP:(mode==='mois'?months[0]:years[0]);
 const L=all.filter(d=>tdDate(d).startsWith(P)),S=tdStats(L);
 const year=P.slice(0,4),Y=all.filter(d=>tdDate(d).startsWith(year));
 const rows=[...Array(12)].map((_,i)=>{const m=year+'-'+String(i+1).padStart(2,'0');return[m,tdStats(Y.filter(d=>tdDate(d).startsWith(m)))]});
 const mx=Math.max(1,...rows.map(r=>Math.max(r[1].called,r[1].rdv)));
 const rd=L.filter(d=>d.envoye),av=PFS.map(x=>[x,rd.filter(d=>pfInfo(d).st===x[0]).length]);
 const tile=(l,v,c,e)=>`<div class="card tile"><span style="${c?'color:'+c:''}">${l}</span><b>${v}</b>${e?`<em>${e}</em>`:''}</div>`;
 return `<div class="ph"><div><span class="eyebrow">Prospection</span><h1>Performance téléprospection</h1><p>${u.kind==='phoneuse'?'Vos appels et vos RDV pris, d’un coup d’œil.':'Les indicateurs de chaque téléprospectrice, par mois ou par année.'}</p></div>
 <div class="acts">${u.kind==='direction'?selUi('tdU',[['','Toutes les téléprospectrices'],...db.equipe.filter(e=>e.type==='phoneuse').map(e=>[e.id,e.nom])],ui.tdU||'','Téléprospectrice'):''}${selUi('tdM',[['mois','Par mois'],['annee','Par année']],mode,'Période')}${selUi('tdP',mode==='mois'?months.map(m=>[m,moisL(m)]):years.map(y=>[y,y]),P,'Choix')}<button class="btn" data-a="tdCsv">Exporter (CSV)</button></div></div>
 <div class="grid g4" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">${tile('Fiches saisies',S.n)}${tile('Appelés',S.called)}${tile('Intéressés',S.inter,'#7048e8')}${tile('RDV pris',S.rdv,'#12b886')}${tile('À rappeler',S.rap,'#f08c00')}${tile('Non intéressés',S.non,'#e03131')}${tile('Taux RDV / appelés',S.taux==null?'—':S.taux+' %','','RDV pris sur fiches appelées')}</div>
 <div class="grid g21" style="margin-top:14px"><div class="card panel"><h3>${year} · mois par mois <small><span style="color:#2563EB">■</span> appelés <span style="color:#12b886">■</span> RDV pris</small></h3>
 <div style="display:flex;align-items:flex-end;gap:8px;height:160px;margin-top:12px">${rows.map(([m,x])=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0"><div style="display:flex;align-items:flex-end;gap:3px;height:130px;width:100%;justify-content:center"><div title="${x.called} appelés" style="width:42%;height:${x.called/mx*100}%;min-height:${x.called?3:0}px;background:#2563EB;border-radius:4px 4px 0 0"></div><div title="${x.rdv} RDV" style="width:42%;height:${x.rdv/mx*100}%;min-height:${x.rdv?3:0}px;background:#12b886;border-radius:4px 4px 0 0"></div></div><small style="font-size:10px;color:${m===P?'var(--ink)':'var(--muted)'};font-weight:${m===P?800:500}">${MOIS[+m.slice(5)-1].slice(0,3)}</small></div>`).join('')}</div></div>
 <div class="card panel"><h3>Que deviennent les RDV pris ? <small>${moisL(P)}</small></h3>${rd.length?`<div style="display:flex;height:16px;border-radius:8px;overflow:hidden;margin:12px 0">${av.filter(a=>a[1]).map(([x,c])=>`<div title="${x[1]} : ${c}" style="flex:${c};background:${x[2]}"></div>`).join('')}</div><div style="display:grid;gap:6px">${av.map(([x,c])=>`<div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:3px;background:${x[2]}"></span><span style="flex:1">${x[1]}</span><b>${c}</b></div>`).join('')}</div>`:'<div class="note" style="margin-top:10px">Aucun RDV pris sur cette période.</div>'}</div></div>
 <div class="sect">Détail ${year}</div><div class="card panel"><table class="tbl"><thead><tr><th>Mois</th><th style="text-align:right">Fiches</th><th style="text-align:right">Appelés</th><th style="text-align:right">Intéressés</th><th style="text-align:right">RDV pris</th><th style="text-align:right">Non int.</th><th style="text-align:right">Taux</th></tr></thead><tbody>${rows.filter(r=>r[1].n).map(([m,x])=>`<tr style="${m===P?'font-weight:800':''}"><td>${moisL(m)}</td><td style="text-align:right">${x.n}</td><td style="text-align:right">${x.called}</td><td style="text-align:right">${x.inter}</td><td style="text-align:right">${x.rdv}</td><td style="text-align:right">${x.non}</td><td style="text-align:right">${x.taux==null?'—':x.taux+' %'}</td></tr>`).join('')||'<tr><td colspan="7"><div class="note">Aucune fiche cette année.</div></td></tr>'}${(()=>{const t=tdStats(Y);return `<tr style="font-weight:900;border-top:2px solid var(--line)"><td>Total ${year}</td><td style="text-align:right">${t.n}</td><td style="text-align:right">${t.called}</td><td style="text-align:right">${t.inter}</td><td style="text-align:right">${t.rdv}</td><td style="text-align:right">${t.non}</td><td style="text-align:right">${t.taux==null?'—':t.taux+' %'}</td></tr>`})()}</tbody></table></div>`;
}
function tdCsv(){const rows=[['Année','Mois','Date','Établissement','Ville','Code postal','Téléphone','Téléprospectrice','Statut de suivi','Date d’appel','Contact','Relance','RDV pris le','RDV','Commercial','Avancement client','Notes']];
 tdList().slice().sort((a,b)=>LST.findIndex(x=>x[0]===tdSt(a))-LST.findIndex(x=>x[0]===tdSt(b))||tdDate(a).localeCompare(tdDate(b))).forEach(d=>{const dt=tdDate(d),s0=d.suivi||{};rows.push([dt.slice(0,4),dt.slice(5,7),dt,d.nom,d.ville,d.cp||'',d.tel||'',EM(d.phoneuse).nom==='—'?'':EM(d.phoneuse).nom,(LST.find(x=>x[0]===tdSt(d))||LST[0])[1],s0.date||'',s0.contact||'',s0.relance||'',d.envoye?d.envoye.slice(0,10):'',d.rdv?d.rdv+(d.rdvH?' '+d.rdvH:''):'',d.commercial?EM(d.commercial).nom:'',d.envoye?(PFS.find(x=>x[0]===pfInfo(d).st)||[0,''])[1]:'',s0.notes||''])});
 csvDl('performance-teleprospection-'+TODAY+'.csv',rows)}

function V_auto(){

 try{

  $('#usineMsg').innerHTML=`${r.count} fichiers Word prêts dans <b>${esc(r.name)}</b>.`;

}

/* ---------- Toasts ---------- */
function toast({title,sub='',kind='info',focus=null,icon}){
 const box=$('#toasts');const el=document.createElement('div');el.className='toast '+kind;
 el.innerHTML=`<div class="ti">${ic(icon||(kind==='ok'?'check':kind==='bad'||kind==='warn'?'alert':kind==='jv'?'map':'bell'),'s')}</div><div style="min-width:0"><b>${esc(title)}</b><small>${esc(sub)}</small></div><time>${hhmm()}</time><span class="tb"></span>`;
 if(focus)el.onclick=()=>focusMap(focus.kind,focus.id);
 box.prepend(el);while(box.children.length>3)box.lastChild.remove();
 setTimeout(()=>{el.style.transition='opacity .4s';el.style.opacity='0';setTimeout(()=>el.remove(),400)},6000);
}

function runCommand(raw){
 const q=norm(raw);if(!q)return false;
 const has=(...w)=>w.some(x=>q.includes(norm(x)));
 if(window.Map3D&&isMapV(ui.view)){
  if(has('dezoom','recule','eloigne','moins pres','zoom arriere')){Map3D.cam('out');return true}
  if(has('zoom','rapproche','approche','plus pres')){Map3D.cam('in');return true}
  if(has('tourne a gauche','gauche')&&has('tourne','pivote','gauche')){Map3D.cam('rl');return true}
  if(has('tourne a droite','droite')&&has('tourne','pivote','droite')){Map3D.cam('rr');return true}
  if(has('vue d ensemble','recentre','accueil','maison')){Map3D.cam('home');return true}}
 if(has('audit')&&!has('qualiopi')){const L=(db.audits||[]).filter(a=>!a.done).sort((a,b)=>a.date.localeCompare(b.date));const nx=L[0];if(nx){focusMap('ent',nx.ent);jarvis('Prochain audit',`${ENTNAME(nx.ent)} · ${fmtL(nx.date)} ${nx.date.slice(0,4)} · ${EM(nx.owner).nom}`)}else jarvis('Audits','Aucun audit programmé');return true}
 if(has('rattach','dossier')){nav('opco');jarvis('Dossiers à rattacher',`${dossiers().filter(d=>!d.client).length} dossiers sans entreprise`);return true}
 if(has('mehdi')){focusMap('mehdi','E8');jarvis('Mehdi localisé',mehdiDay().pos.label);return true}
 if(has('ayoub','tache','administratif')){focusMap('office','admin');jarvis('Tâches d’Ayoub',`${ayoubTasks().length} tâches, dont ${ayoubTasks().filter(a=>a.lv==='urgent').length} urgentes`);return true}
 for(const t of TRAINERS()){const fn=norm(t.nom.split(' ')[0]);if(q.includes(fn)){focusMap('room',t.id);const s=sessionInRoom(t.id);jarvis(roomName(t.id),s?`${t.nom.split(' ')[0]} est en session avec ${CL(s.client).nom} (${s.stagList.length} stagiaires)`:`${t.nom.split(' ')[0]} n’a pas de session aujourd’hui`);return true}}
 if(has('entrer','interieur','centre','salles')){ui.view='map';ui.inside=true;ui.sel=null;refresh();jarvis('Entrée dans le centre','Salles des formateurs et bureaux');return true}
 if(has('carte','territoire','sortir','dehors')){ui.view='map';ui.inside=false;ui.sel=null;refresh();window.Map3D&&Map3D.cam('home');jarvis('Carte du territoire',`${ui.ents.length} entreprises`);return true}
 const sc=SECTORS.find(s=>[s.nom,s.short,...s.villes].some(v=>norm(v).length>2&&q.includes(norm(v))));
 if(has('p1','urgent','priorit')){ui.tf.p=1;ui.view='map';ui.inside=false;ui.sel=sc?{kind:'sect',id:sc.id}:null;refresh();if(sc)Map3D&&Map3D.focus('sect',sc.id);jarvis('Priorités P1'+(sc?' · '+sc.nom:''),`${ui.ents.filter(e=>e.p===1&&(!sc||e.sect===sc.id)).length} entreprises à traiter aujourd’hui`);return true}
 if(sc){focusMap('sect',sc.id);jarvis(sc.nom,`${ui.ents.filter(e=>e.sect===sc.id).length} entreprises dans le secteur`);return true}
 const map={facture:'factures',relance:'factures',opco:'opco',import:'opco',akto:'opco',qualiopi:'qualiopi',audit:'qualiopi',agenda:'agenda',rdv:'agenda',document:'usine',usine:'usine',convocation:'usine',attestation:'usine',emargement:'usine',session:'sessions',cockpit:'cockpit',aujourd:'cockpit',equipe:'equipe',client:'clients',prospect:'clients',regle:'auto'};
 for(const k in map)if(q.includes(k)){nav(map[k]);jarvis('Ouverture',NAV.find(n=>n[0]===map[k])[1]);return true}
 const e=ui.ents.find(x=>norm(x.nom).includes(q)||q.includes(norm(x.nom)));if(e){focusMap('ent',e.id);jarvis(e.nom,`P${e.p} · ${e.reasons[0]||''}`);return true}
 return false;
}

<script>
/* ====== PPA Pilot — serveur partagé (Apps Script) : synchro + dossiers clients ====== */
(function(){
'use strict';
const DEF_URL='https://script.google.com/macros/s/AKfycbxziO1Zi_3EnQbFJ9Ob-Khku1QQKqJK2lc0cmnLFBBtzdT6WYx7ai_mYSGILsq48zc56A/exec';
const LS='ppa-srv',LB='ppa-sync-base';
const MEM={};

 const j=await r.json();if(!j.ok&&!j.conflict)throw new Error(j.err==='auth'?'Jeton refusé':j.err==='forbidden'?'Droit insuffisant':(j.err||'Erreur serveur'));return j}

/* ---------- fusion à 3 voies (base / local / distant) ---------- */
const mj=x=>JSON.stringify(x);
const isO=x=>x&&typeof x==='object'&&!Array.isArray(x);

function mrg(b,l,r,k){
 if(mj(l)===mj(r))return l;
 if(mj(l)===mj(b))return r;
 if(mj(r)===mj(b))return l;
 if(k==='seq'&&typeof l==='number'&&typeof r==='number')return Math.max(l,r);
 if(isO(l)&&isO(r)){const bb=isO(b)?b:{},o={};
  new Set([...Object.keys(l),...Object.keys(r)]).forEach(key=>{
   const inL=key in l,inR=key in r,inB=key in bb;
   if(!inL){if(inB&&mj(r[key])===mj(bb[key]))return;o[key]=r[key]}
   else if(!inR){if(inB&&mj(l[key])===mj(bb[key]))return;o[key]=l[key]}
   else o[key]=mrg(bb[key],l[key],r[key],key)});
  return o}
 if(Array.isArray(l)&&Array.isArray(r)&&idArr(l)&&idArr(r)&&(b==null||idArr(b))){
  const bm=new Map((b||[]).map(o=>[o.id,o])),lm=new Map(l.map(o=>[o.id,o])),rm=new Map(r.map(o=>[o.id,o]));
  const ids=[...r.map(o=>o.id),...l.filter(o=>!rm.has(o.id)).map(o=>o.id)],out=[];
  ids.forEach(id=>{const bi=bm.get(id),li=lm.get(id),ri=rm.get(id);
   if(!li){if(bi&&mj(ri)===mj(bi))return;out.push(ri)}
   else if(!ri){if(bi&&mj(li)===mj(bi))return;out.push(li)}
   else out.push(mrg(bi,li,ri))});
  return out}
 return l}
window.__mrg=mrg;

/* ---------- synchro ---------- */
const SY={st:'off',msg:'',busy:false,again:false,timer:null,last:0};

 const m={off:['#868e96','Hors serveur'],ok:['#12b886','Synchronisé'],sync:['#2563EB','Synchronisation…'],err:['#e03131','Hors ligne']}[SY.st];

  let j=await api('pull'),remote=j.db,rev=j.rev,b=base(),merged,changedLocal=false;

  else if(!b||!okDb(b.db)){merged=remote;changedLocal=mj(remote)!==mj(db)}  // premier appareil : on adopte le serveur

   if(okDb(remote)&&mj(merged)===mj(remote)){break}

}

function fmtSize(n){return n>1048576?(n/1048576).toFixed(1)+' Mo':Math.max(1,Math.round(n/1024))+' Ko'}

function slot(id,type,label,opts){opts=opts||{};const L=docsOf(id,type);const key=id+'|'+type,busy=DOS.busy[key],fl=DOS.flash===key;
 return `<div class="dl ${L.length?'done':(opts.opt?'':'need')} ${fl?'flash':''}"><span class="ck">✓</span><div class="g"><b>${esc(label)}</b>${opts.pre||''}${L.map(d=>docLine(d,id)).join('')}${busy?'<small style="display:block">Envoi en cours…</small>':''}</div>${opts.extra||''}<button type="button" class="btn sm" data-a="scanOpen" data-type="${esc(type)}" data-cid="${esc(id)}" data-label="${esc(label)}" ${busy?'disabled':''} title="Photographier le document, plusieurs pages possibles">Scanner</button><label class="btn sm" style="cursor:pointer;${busy?'opacity:.5;pointer-events:none':''}">${ic('plus','s')} ${L.length?'Ajouter':(opts.btn||'Téléverser')}<input type="file" hidden data-up="${esc(type)}" data-cid="${esc(id)}" accept=".pdf,.png,.jpg,.jpeg,.heic,.doc,.docx,.xls,.xlsx"></label></div>`}
function missing(id){const d=dosOf(id);let tot=0,got=0;const need=k=>{tot++;if(docsOf(id,k).length)got++};

/* ---------- documents remis : version au nom du client, imprimable ---------- */
const PDFLIB_URL='https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js';
function loadPdfLib(){return new Promise((res,rej)=>{if(window.PDFLib)return res();const sc=document.createElement('script');sc.src=PDFLIB_URL;sc.onload=()=>res();sc.onerror=()=>rej(new Error('Module PDF indisponible (connexion internet requise)'));document.head.appendChild(sc)})}
const wa=t=>String(t||'').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/œ/g,'oe').replace(/Œ/g,'OE').replace(/[^\x20-\x7e\xa0-\xff]/g,'');
async function namedPdf(id,keys){await loadPdfLib();const {PDFDocument,StandardFonts,rgb}=PDFLib;const E=ent(id);const c=db.clients.find(x=>x.id===id)||db.deals.find(x=>x.id===id)||{};
 const out=await PDFDocument.create();const fb=await out.embedFont(StandardFonts.HelveticaBold),fr=await out.embedFont(StandardFonts.Helvetica);const done=[],skip=[];
 const left=wa(E.nom).toUpperCase(),sub=wa([c.adresse,c.cp,E.ville].filter(Boolean).join(' ')),right=wa('Remis par PPA Formation le '+new Date().toLocaleDateString('fr-FR'));
 for(const k of keys){const lb=docsOf('LIB','lib:'+k)[0];if(!lb){skip.push(LABEL[k]);continue}
  const j=await api('get',{id:lb.id});if(!/pdf/i.test(j.mime||'')&&!/\.pdf$/i.test(j.name||'')){skip.push(LABEL[k]+' (pas un PDF)');continue}
  const by=atob(j.b64),u=new Uint8Array(by.length);for(let i=0;i<by.length;i++)u[i]=by.charCodeAt(i);
  const src=await PDFDocument.load(u,{ignoreEncryption:true});const pages=await out.embedPages(src.getPages());
  pages.forEach(ep=>{const w=ep.width,h=ep.height,B=Math.max(30,h*0.045),sc=(h-B)/h;const pg=out.addPage([w,h]);
   pg.drawPage(ep,{x:(w-w*sc)/2,y:0,xScale:sc,yScale:sc});
   pg.drawRectangle({x:0,y:h-B,width:w,height:B,color:rgb(.078,.129,.239)});
   const fs=B*0.36;pg.drawText(left,{x:B*0.45,y:h-B*0.48,size:fs,font:fb,color:rgb(1,1,1)});
   if(sub)pg.drawText(sub,{x:B*0.45,y:h-B*0.82,size:fs*0.68,font:fr,color:rgb(.8,.9,.9)});
   const rs=fs*0.68;pg.drawText(right,{x:w-B*0.45-fr.widthOfTextAtSize(right,rs),y:h-B*0.6,size:rs,font:fr,color:rgb(.8,.9,.9)})});
  done.push(k)}
 if(!done.length)return {skip};const bytes=await out.save();window.__lastPdf=bytes;return {done,skip,blob:new Blob([bytes],{type:'application/pdf'})}}
function printBlob(blob,name){const url=URL.createObjectURL(blob);document.querySelectorAll('.prnov').forEach(n=>n.remove());
 const o=document.createElement('div');o.className='prnov';o.style.cssText='position:fixed;inset:0;z-index:3500;background:rgba(8,20,24,.82);display:flex;flex-direction:column;padding:14px;gap:10px';
 o.innerHTML=`<div style="display:flex;gap:8px;align-items:center;color:#fff"><b style="flex:1;font-size:15px">${esc(name)}</b><button type="button" class="btn primary" data-p="print">Imprimer</button><button type="button" class="btn" data-p="dl">Télécharger</button><button type="button" class="btn" data-p="tab">Ouvrir dans un onglet</button><button type="button" class="btn" data-p="x">Fermer</button></div><iframe src="${url}#toolbar=1" style="flex:1;border:0;border-radius:12px;background:#fff"></iframe>`;
 o.addEventListener('click',e=>{const p=e.target.dataset&&e.target.dataset.p;if(!p)return;e.stopPropagation();
  if(p==='x'){o.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
  if(p==='dl')saveBlob(blob,name);if(p==='tab')window.open(url,'_blank');
  if(p==='print'){try{const f=o.querySelector('iframe');f.contentWindow.focus();f.contentWindow.print()}catch(err){window.open(url,'_blank')}}});
 document.body.appendChild(o)}
function saveBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
async function remGen(keys,mode){const id=DOS.cur;if(!cfg()){toastS('Serveur non connecté','','warn');return}DOS.gen=1;rerender();
 try{const r=await namedPdf(id,keys);if(!r.blob){toastS('Version type manquante','Déposez d’abord le PDF dans la Bibliothèque : '+r.skip.join(', '),'warn')}
  else{const nm=(keys.length>1?'Documents remis':LABEL[keys[0]])+' - '+ent(id).nom+'.pdf';mode==='dl'?saveBlob(r.blob,nm):printBlob(r.blob,nm);
   const d=dosOf(id);watch(id,()=>{r.done.forEach(k=>{if(!d.rem[k])d.rem[k]=(typeof TODAY!=='undefined'?TODAY:new Date().toISOString().slice(0,10))});window.save()});
   toastS(mode==='dl'?'PDF téléchargé':'Document prêt à imprimer',r.done.length+' document'+(r.done.length>1?'s':'')+' au nom de '+ent(id).nom+(r.skip.length?' · absents de la bibliothèque : '+r.skip.join(', '):''))}}
 catch(e){toastS('Génération impossible',String(e.message||e),'warn')}
 DOS.gen=0;rerender()}

const SC={id:null,type:null,label:'',pages:[],busy:false};
async function scanAdd(files){for(const f of files){try{const bmp=await createImageBitmap(f);const sc=Math.min(1,1700/Math.max(bmp.width,bmp.height));const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  const bl=await new Promise(r=>cv.toBlob(r,'image/jpeg',.8));SC.pages.push({bl,w:cv.width,h:cv.height,url:URL.createObjectURL(bl)})}catch(e){toastS('Image illisible',f.name||'','warn')}}scanDraw()}
function scanDraw(){let o=document.querySelector('.scanov');if(!o){o=document.createElement('div');o.className='scanov';o.style.cssText='position:fixed;inset:0;z-index:3400;background:rgba(8,20,24,.9);display:flex;flex-direction:column;padding:14px;gap:12px;color:#fff;overflow:auto';document.body.appendChild(o)}
 o.innerHTML=`<div style="display:flex;gap:8px;align-items:center"><div style="flex:1"><small style="opacity:.7">Scanner · ${esc(ent(SC.id).nom)}</small><b style="display:block;font-size:17px">${esc(SC.label)}</b></div><button type="button" class="btn" style="background:#fff;color:#0b3b3f" data-a="scanClose">Annuler</button></div>
 <div style="display:flex;gap:10px;flex-wrap:wrap;align-content:flex-start;flex:1">${SC.pages.map((p,i)=>`<div style="position:relative;width:130px"><img src="${p.url}" alt="Page ${i+1}" style="width:130px;height:180px;object-fit:cover;border-radius:10px;border:2px solid #fff"><span style="position:absolute;left:6px;top:6px;background:#0b3b3f;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800">${i+1}</span><button type="button" data-a="scanDel" data-i="${i}" aria-label="Retirer la page ${i+1}" style="position:absolute;right:6px;top:6px;border:0;border-radius:50%;width:26px;height:26px;background:#e03131;color:#fff;font-weight:900;cursor:pointer">×</button></div>`).join('')||'<div style="opacity:.75;margin:auto;text-align:center;max-width:320px">Photographiez le document, une page après l’autre.<br>Toutes les pages sont réunies en un seul PDF.</div>'}</div>
 <div style="display:flex;gap:10px;flex-wrap:wrap"><label class="btn primary" style="cursor:pointer;flex:1;justify-content:center;padding:14px">${SC.pages.length?'+ Page suivante':'Prendre la photo'}<input type="file" accept="image/*" capture="environment" hidden data-scan="1"></label><label class="btn" style="cursor:pointer;justify-content:center;padding:14px;background:#fff;color:#0b3b3f">Depuis la galerie<input type="file" accept="image/*" multiple hidden data-scan="1"></label>${SC.pages.length?`<button type="button" class="btn primary" style="background:#12b886;border-color:#12b886;flex:1;justify-content:center;padding:14px" data-a="scanSave" ${SC.busy?'disabled':''}>${SC.busy?'Envoi…':`Enregistrer · ${SC.pages.length} page${SC.pages.length>1?'s':''}`}</button>`:''}</div>`}
async function scanSave(){if(SC.busy||!SC.pages.length)return;SC.busy=true;scanDraw();const id=SC.id,type=SC.type,key=id+'|'+type;
 try{await loadPdfLib();const pdf=await PDFLib.PDFDocument.create();for(const p of SC.pages){const img=await pdf.embedJpg(await p.bl.arrayBuffer());const land=p.w>p.h,W=land?842:595,H=land?595:842,m=14,k=Math.min((W-2*m)/p.w,(H-2*m)/p.h);const pg=pdf.addPage([W,H]);pg.drawImage(img,{x:(W-p.w*k)/2,y:(H-p.h*k)/2,width:p.w*k,height:p.h*k})}
  const bytes=await pdf.save();if(bytes.length>9*1048576)throw new Error('PDF trop lourd (9 Mo max) : retirez des pages');let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  const name=wa(SC.label).replace(/[\\/:*?"<>|]/g,' ').trim()+' - '+wa(ent(id).nom).replace(/[\\/:*?"<>|]/g,' ')+'.pdf';
  const j=await api('up',{type,name,mime:'application/pdf',b64:btoa(bin),client:id==='LIB'?LIB:ent(id)});
