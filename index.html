<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PPA Pilot"><meta name="theme-color" content="#14213D"><meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png"><link rel="manifest" href="manifest.json"><title>PPA Pilot</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#F3F4F6;color:#14213D;font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;display:grid;place-items:center;padding:16px}
.box{background:#fff;border:1px solid #D9DEE5;border-radius:10px;padding:32px;width:min(440px,100%);text-align:center}
.logo{width:52px;height:52px;border-radius:6px;background:#14213D;color:#fff;display:grid;place-items:center;font-weight:600;letter-spacing:.08em;margin:0 auto 16px}
h1{font:600 24px Georgia,"Times New Roman",serif;margin:0 0 6px}p{margin:0 0 18px;color:#566176}
textarea{width:100%;border:1px solid #C3CAD4;border-radius:6px;padding:11px 12px;font:inherit;font-size:16px;resize:vertical;min-height:84px}textarea:focus{outline:none;border-color:#1E3A5F}
button{margin-top:12px;width:100%;border:0;border-radius:6px;background:#1E3A5F;color:#fff;font:600 15px inherit;padding:13px;cursor:pointer}button:disabled{opacity:.6}
#msg{margin-top:14px;font-size:14px;min-height:20px}#msg.err{color:#A12A22}
</style></head><body>
<div class="box"><div class="logo">PPA</div><h1>PPA Pilot</h1><p id="sub">Accès réservé. Collez votre jeton ou votre code de configuration.</p>
<div id="form" hidden><textarea id="tok" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Jeton ou code de configuration" aria-label="Jeton ou code de configuration"></textarea><button id="go" type="button">Ouvrir le CRM</button></div>
<div id="msg" role="status"></div></div>
<script>
(function(){
const U='https://script.google.com/macros/s/AKfycbxziO1Zi_3EnQbFJ9Ob-Khku1QQKqJK2lc0cmnLFBBtzdT6WYx7ai_mYSGILsq48zc56A/exec',LS='ppa-srv';
const $=i=>document.getElementById(i);const msg=(t,e)=>{$('msg').textContent=t;$('msg').className=e?'err':''};
const cfg=()=>{try{return JSON.parse(localStorage.getItem(LS)||'null')}catch(e){return null}};
const b2u=b=>{const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
async function boot(tok,code){msg('Vérification de l’accès…');
 let j;try{j=await (await fetch(U,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({token:tok,a:'key'})})).json()}catch(e){throw new Error('Serveur injoignable. Vérifiez votre connexion.')}
 if(!j.ok||!j.key)throw new Error(j.err==='auth'?'Accès refusé : jeton inconnu ou révoqué.':'Accès impossible ('+(j.err||'erreur')+').');
 msg('Chargement…');const raw=b2u((await (await fetch('app.enc?v='+Date.now(),{cache:'no-store'})).text()).trim());
 const k=await crypto.subtle.importKey('raw',b2u(j.key),'AES-GCM',false,['decrypt']);
 const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},k,raw.slice(12)));
 const c=cfg()||{};if(c.t!==tok||!c.u){try{localStorage.setItem(LS,JSON.stringify({u:U,t:tok,r:j.role||c.r||'terrain'}))}catch(e){}}
 if(code){try{sessionStorage.setItem('ppa-cfg-pending',code)}catch(e){}}
 document.open();document.write(html);document.close()}
function parse(v){v=(v||'').trim().replace(/\s+/g,'');if(/^[0-9a-f]{64}$/i.test(v))return{t:v.toLowerCase()};
 try{const c=JSON.parse(decodeURIComponent(escape(atob(v))));if(c&&c.s&&c.s.t)return{t:c.s.t,code:v}}catch(e){}return null}
function ask(m,e){$('form').hidden=false;if(m)msg(m,e)}
$('go').onclick=async()=>{const p=parse($('tok').value);if(!p)return msg('Ce texte n’est ni un jeton ni un code de configuration.',1);$('go').disabled=true;try{await boot(p.t,p.code)}catch(e){$('go').disabled=false;msg(e.message||String(e),1)}};
const c=cfg();if(c&&c.t){boot(c.t).catch(e=>ask(e.message||String(e),1))}else ask('')
})();
</script></body></html>
