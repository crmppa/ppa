<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Émargement — PPA</title>
<style>
:root{--bg:#F5F6F8;--panel:#fff;--ink:#16213A;--ink2:#4A5468;--line:#D9DEE5;--acc:#2456C7;--ok:#0B7A0B;--bad:#B42828}
@media(prefers-color-scheme:dark){:root{--bg:#0F141E;--panel:#171D2A;--ink:#E8ECF4;--ink2:#B5BDCD;--line:#2A3243;--acc:#6E9BFF;--ok:#5FD25F;--bad:#FF8A8A}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;padding:16px;padding:max(16px,env(safe-area-inset-top)) 16px}
.box{max-width:460px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
h1{font-size:19px;margin:0 0 2px}.sub{color:var(--ink2);margin:0 0 14px;font-size:14px}
label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin:12px 0 4px}
select,button{font:inherit}select{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel);color:var(--ink)}
.seg{display:flex;gap:8px}.seg button{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:12px;font-weight:700;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
canvas{width:100%;height:170px;border:2px dashed var(--line);border-radius:12px;background:#fff;touch-action:none;margin-top:4px}
.row{display:flex;gap:10px;margin-top:12px}.row button{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:13px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}.btn:disabled{opacity:.5}
#msg{margin-top:12px;min-height:22px;font-weight:600}#msg.ok{color:var(--ok)}#msg.err{color:var(--bad)}
.done{display:none;text-align:center;padding:10px}.done b{font-size:17px}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}td,th{border:1px solid var(--line);padding:6px;text-align:left}th{color:var(--ink2);font-size:11px;text-transform:uppercase}
.tick{color:var(--ok);font-weight:800}
[hidden]{display:none!important}
</style></head><body>
<div class="box" id="box"><h1 id="titre">Émargement</h1><p class="sub" id="sub">Chargement…</p>
 <div id="form" hidden>
  <label for="st">Votre nom</label><select id="st"></select>
  <label for="jr">Jour</label><select id="jr"></select>
  <label>Demi-journée</label><div class="seg" id="dm"><button type="button" data-d="m" aria-pressed="false">Matin</button><button type="button" data-d="a" aria-pressed="false">Après-midi</button></div>
  <label>Votre signature</label><canvas id="cv" aria-label="Zone de signature"></canvas>
  <div class="row"><button class="btn" id="clr" type="button">Effacer</button><button class="btn primary" id="ok" type="button">Valider ma signature</button></div>
  <div id="msg" role="status"></div>
  <table id="tab"><thead><tr><th>Stagiaire</th><th>Jour</th><th>½</th><th></th></tr></thead><tbody></tbody></table>
 </div>
 <div class="done" id="done"><div style="font-size:40px">✓</div><b>Signature enregistrée</b><p class="sub" id="doneSub"></p><button class="btn" id="again" type="button">Signer un autre créneau</button></div>
</div>
<script src="../lib/supabase-js-2.45.4.min.js"></script>
<script>
(function(){
const URL='https://nzecrjairbkrnprjyrzm.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56ZWNyamFpcmJrcm5wcmp5cnptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwNTY3MzEsImV4cCI6MjExMDYzMjczMX0.-sI9jD4EXdI5EC9rkaL3L-POntXQtrP4RjeY5ga3lnM';
const sb=window.supabase.createClient(URL,KEY);
const $=i=>document.getElementById(i);const msg=(t,k)=>{$('msg').textContent=t||'';$('msg').className=k||''};
const token=(location.hash.replace(/^#/,'')||new URLSearchParams(location.search).get('t')||'').trim();
let demi='',cv=$('cv'),cx=cv.getContext('2d'),drawn=false;
function sizeCanvas(){const r=cv.getBoundingClientRect();cv.width=r.width*2;cv.height=r.height*2;cx.scale(2,2);cx.lineWidth=2.4;cx.lineCap='round';cx.strokeStyle='#14213D'}
let last=null;const pos=e=>{const r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return[(t.clientX-r.left),(t.clientY-r.top)]};
const down=e=>{last=pos(e);drawn=true;e.preventDefault()},move=e=>{if(!last)return;const p=pos(e);cx.beginPath();cx.moveTo(last[0],last[1]);cx.lineTo(p[0],p[1]);cx.stroke();last=p;e.preventDefault()},up=()=>last=null;
cv.addEventListener('mousedown',down);cv.addEventListener('mousemove',move);addEventListener('mouseup',up);
cv.addEventListener('touchstart',down,{passive:false});cv.addEventListener('touchmove',move,{passive:false});cv.addEventListener('touchend',up);addEventListener('resize',()=>{if(!document.getElementById('form').hidden){const keep=cv.toDataURL();sizeCanvas()}});
$('clr').onclick=()=>{cx.clearRect(0,0,cv.width,cv.height);drawn=false};
$('dm').querySelectorAll('button').forEach(b=>b.onclick=()=>{demi=b.dataset.d;$('dm').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
let SHEET=null;
function fillTable(){const tb=$('tab').querySelector('tbody');tb.innerHTML=(SHEET.signatures||[]).map(s=>`<tr><td>${s.stagiaire}</td><td>${s.jour.slice(8,10)}/${s.jour.slice(5,7)}</td><td>${s.demi==='m'?'matin':'ap-m'}</td><td class="tick">✓</td></tr>`).join('')}
async function load(){
 if(!token){$('sub').textContent='Lien invalide. Scannez le QR code affiché en salle.';return}
 const {data,error}=await sb.rpc('emarg_get_sheet',{p_token:token});
 if(error||!data){$('sub').textContent='Feuille introuvable ou expirée. Demandez au formateur.';return}
 SHEET=data;$('titre').textContent=data.titre||'Émargement';$('sub').textContent='Choisissez votre nom, le jour, la demi-journée, puis signez.';
 $('st').innerHTML=(data.stagiaires||[]).map(s=>`<option>${s}</option>`).join('');
 const jours=(data.jours||[]).map(j=>j.d);const t=todayISO();
 $('jr').innerHTML=jours.map((d,i)=>`<option value="${d}" ${d===t?'selected':''}>Jour ${i+1} · ${d.slice(8,10)}/${d.slice(5,7)}/${d.slice(0,4)}</option>`).join('');
 // demi-journée pré-remplie selon l'heure
 demi=new Date().getHours()<13?'m':'a';$('dm').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.d===demi));
 $('form').hidden=false;sizeCanvas();fillTable();
}
$('ok').onclick=async()=>{
 if(!drawn)return msg('Signez dans le cadre avant de valider.','err');if(!demi)return msg('Choisissez matin ou après-midi.','err');
 $('ok').disabled=true;msg('Enregistrement…');
 const png=cv.toDataURL('image/png');
 const {data,error}=await sb.rpc('emarg_add_sign',{p_token:token,p_jour:$('jr').value,p_demi:demi,p_stagiaire:$('st').value,p_png:png});
 $('ok').disabled=false;
 if(error||!data||!data.ok){return msg((data&&data.err)||'Erreur réseau, réessayez.','err')}
 $('doneSub').textContent=$('st').value+' · '+$('jr').selectedOptions[0].textContent+' · '+(demi==='m'?'matin':'après-midi');
 $('form').hidden=true;$('done').style.display='block';
};
$('again').onclick=()=>{$('done').style.display='none';cx.clearRect(0,0,cv.width,cv.height);drawn=false;load()};
load();
})();
</script></body></html>
